name: probe-eq
on:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: [.github/workflows/probe-eq.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -D h.txt -H 'Origin: https://ira0ma.github.io' 'https://api.p2pquake.net/v2/history?codes=551&codes=556&limit=3' -o eq.json; grep -i "access-control\|cache\|HTTP/" h.txt
          python3 -c "
          import json;d=json.load(open('eq.json'))
          for x in d: print(json.dumps(x,ensure_ascii=False)[:1500])
          "
          curl -sS -D h2.txt -H 'Origin: https://ira0ma.github.io' 'https://www.jma.go.jp/bosai/quake/data/list.json' -o jma.json; grep -i "access-control\|HTTP/" h2.txt; head -c 600 jma.json; echo
          pip -q install websockets
          timeout 25 python3 -c "
          import asyncio,websockets
          async def m():
            async with websockets.connect('wss://api.p2pquake.net/v2/ws',origin='https://ira0ma.github.io') as w:
              print('ws connected')
              try:
                while True: print((await asyncio.wait_for(w.recv(),20))[:400])
              except Exception as e: print('end',type(e).__name__)
          asyncio.run(m())
          " || true
