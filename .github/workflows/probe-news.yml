name: Probe real-time news sources (temporary)

on:
  workflow_dispatch:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: [".github/workflows/probe-news.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          GN='https://news.google.com/rss/search?q=%E6%A4%8D%E7%94%B0%20OR%20%E3%83%91%E3%82%A6%E3%82%A8%E3%83%AB%20when%3A1d&hl=ja&gl=JP&ceid=JP:ja'
          FJ='https://www.financialjuice.com/feed.ashx?xy=rss'
          enc() { python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$1"; }
          for u in "$FJ" "$GN" "https://investinglive.com/feed/" "https://www.fxstreet.com/rss/news" \
                   "https://api.allorigins.win/raw?url=$(enc "$FJ")" "https://api.allorigins.win/raw?url=$(enc "$GN")" \
                   "https://corsproxy.io/?url=$(enc "$FJ")" "https://corsproxy.io/?url=$(enc "$GN")" \
                   "https://api.codetabs.com/v1/proxy?quest=$(enc "$FJ")" "https://api.codetabs.com/v1/proxy?quest=$(enc "$GN")"; do
            echo "=== $u"
            curl -s -m 20 -D h.txt -o b.txt -H "Origin: https://ira0ma.github.io" -A "Mozilla/5.0" "$u" -w "status %{http_code} time %{time_total}s size %{size_download}\n" || echo "curl failed"
            grep -i "access-control-allow-origin\|cache-control\|^age:" h.txt || echo "(no CORS header)"
            python3 - <<'PY' || true
          import re
          b=open("b.txt",encoding="utf-8",errors="replace").read()
          ts=re.findall(r"<title>(.*?)</title>",b,re.S)[1:4]
          ds=re.findall(r"<pubDate>(.*?)</pubDate>",b)[:2]
          print("titles:",[t.strip()[:90] for t in ts]);print("dates:",ds)
          PY
          done
          date -u
