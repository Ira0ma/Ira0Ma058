name: probe-results
on:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: [.github/workflows/probe-results.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" 'https://www.financialjuice.com/feed.ashx?xy=rss' -D h.txt -o fj.xml; grep -i "access-control" h.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('fj.xml').getroot()
          for it in r.iter('item'):
              print(it.findtext('pubDate'),'|',it.findtext('title'))
          PY
          curl -sSL -A "Mozilla/5.0" https://nfs.faireconomy.media/ff_calendar_thisweek.json -D h2.txt -o ff.json; grep -i "access-control\|cache" h2.txt
          python3 -c "
          import json;d=json.load(open('ff.json'));print(d[0].keys())
          for r in d:
            if r['country'] in ('USD','JPY'): print(r)
          " | head -60
