name: Deploy iPad widget to GitHub Pages

on:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: ["ipad-widget/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes (GitHub's minimum): refresh charts, analysis, calendar
    # Morning check at 7:00 JST: extra runs from 6:40 to 7:20 JST (21:40-22:20 UTC), around the
    # New York close (17:00 NY = 6:00 JST in summer, 7:00 JST in winter), so the day's previous close,
    # pivots and notes are fresh even when GitHub delays or skips the 5-minute runs.
    - cron: "40,47,53,58 21 * * *"
    - cron: "3,8,14,20 22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # keep-alive below

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Download the currently published data (fallback if a source fails this hour)
        continue-on-error: true
        run: |
          mkdir -p prev
          for f in market.json calendar.json holidays.json spothist.json news.json typhoon.json pollen.json; do
            curl -fsSL --retry 2 "${{ steps.pages.outputs.base_url }}/$f" -o "prev/$f" || rm -f "prev/$f"
          done
          ls -la prev
      - name: Build site
        run: |
          python3 ipad-widget/build.py
          mkdir -p _site
          cp ipad-widget/ipad.html _site/index.html
          cp ipad-widget/icon-cup.png _site/icon-cup.png
          cp ipad-widget/sw.js _site/sw.js  # notifications only (no caching)
          cp ipad-widget/manifest.webmanifest _site/manifest.webmanifest
          cp ipad-widget/gold.html _site/gold.html
          cp ipad-widget/usdjpy.html _site/usdjpy.html
          cp ipad-widget/btc.html _site/btc.html
          cp ipad-widget/strategy.json _site/strategy.json || true  # daily recap and outlook (written by the morning report task)
      - name: Fetch economic calendar
        continue-on-error: true
        run: |
          if curl -fsSL --retry 3 -A "Mozilla/5.0 (TradeDeskWidget)" \
               https://nfs.faireconomy.media/ff_calendar_thisweek.json -o calendar.json \
             && python3 -c "import json;d=json.load(open('calendar.json'));assert isinstance(d,list);print(len(d),'events')"; then
            python3 - <<'PY'
          import json, datetime
          jst = datetime.timezone(datetime.timedelta(hours=9))
          rows = json.load(open("calendar.json"))
          print("range:", min(r["date"] for r in rows), "->", max(r["date"] for r in rows))
          for r in rows:
              if r.get("country") in ("USD", "JPY"):
                  t = datetime.datetime.fromisoformat(r["date"]).astimezone(jst)
                  print(t.strftime("%m/%d %H:%M JST"), r["country"], r["impact"], r["title"])
          PY
            mv calendar.json _site/calendar.json
          else
            echo "calendar fetch failed; keeping the published copy"; cp prev/calendar.json _site/calendar.json
          fi
      - name: Fetch Japanese public holidays
        continue-on-error: true
        run: |
          if curl -fsSL --retry 3 https://holidays-jp.github.io/api/v1/date.json -o holidays.json \
             && python3 -c "import json;d=json.load(open('holidays.json'));assert isinstance(d,dict) and d;print(len(d),'holidays')"; then
            mv holidays.json _site/holidays.json
          else
            echo "holiday fetch failed; keeping the published copy"; cp prev/holidays.json _site/holidays.json
          fi
      - name: Fetch remarks by central bankers and officials
        continue-on-error: true
        run: |
          python3 ipad-widget/news.py _site/news.json prev/news.json \
            || cp prev/news.json _site/news.json || true
      - name: Fetch typhoons (JMA) and pollen (Weathernews) for the weather card
        continue-on-error: true
        run: python3 ipad-widget/hazards.py _site prev
      - name: Fetch prices and build chart analysis
        continue-on-error: true
        run: |
          python3 ipad-widget/analyze.py _site/market.json --prev=prev/market.json \
            || { cp prev/market.json _site/market.json; cp prev/spothist.json _site/spothist.json || true; }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep the hourly schedule alive
        # GitHub turns off scheduled workflows after 60 days without repository activity;
        # re-enabling this workflow each run resets that timer.
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable" 
