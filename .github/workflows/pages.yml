name: Deploy iPad widget to GitHub Pages

on:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: ["ipad-widget/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: |
          python3 ipad-widget/build.py
          mkdir -p _site
          cp ipad-widget/ipad.html _site/index.html
          cp ipad-widget/icon.png _site/icon.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
