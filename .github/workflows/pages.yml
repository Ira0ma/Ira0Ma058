name: Deploy iPad widget to GitHub Pages

on:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: ["ipad-widget/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"  # hourly: refresh the economic calendar and chart analysis

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write  # keep-alive below

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - name: Download the currently published data (fallback if a source fails this hour)
        continue-on-error: true
        run: |
          mkdir -p prev
          for f in market.json calendar.json holidays.json; do
            curl -fsSL --retry 2 "${{ steps.pages.outputs.base_url }}/$f" -o "prev/$f" || rm -f "prev/$f"
          done
          ls -la prev
      - name: Build site
        run: |
          python3 ipad-widget/build.py
          mkdir -p _site
          cp ipad-widget/ipad.html _site/index.html
          cp ipad-widget/icon.png _site/icon.png
      - name: Fetch economic calendar
        continue-on-error: true
        run: |
          if curl -fsSL --retry 3 -A "Mozilla/5.0 (TradeDeskWidget)" \
               https://nfs.faireconomy.media/ff_calendar_thisweek.json -o calendar.json \
             && python3 -c "import json;d=json.load(open('calendar.json'));assert isinstance(d,list);print(len(d),'events')"; then
            mv calendar.json _site/calendar.json
          else
            echo "calendar fetch failed; keeping the published copy"; cp prev/calendar.json _site/calendar.json
          fi
      - name: Fetch Japanese public holidays
        continue-on-error: true
        run: |
          if curl -fsSL --retry 3 https://holidays-jp.github.io/api/v1/date.json -o holidays.json \
             && python3 -c "import json;d=json.load(open('holidays.json'));assert isinstance(d,dict) and d;print(len(d),'holidays')"; then
            mv holidays.json _site/holidays.json
          else
            echo "holiday fetch failed; keeping the published copy"; cp prev/holidays.json _site/holidays.json
          fi
      - name: Fetch prices and build chart analysis
        continue-on-error: true
        run: |
          python3 ipad-widget/analyze.py _site/market.json --prev=prev/market.json \
            || cp prev/market.json _site/market.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep the hourly schedule alive
        # GitHub turns off scheduled workflows after 60 days without repository activity;
        # re-enabling this workflow each run resets that timer.
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable" 
