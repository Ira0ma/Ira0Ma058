name: Deploy iPad widget to GitHub Pages

on:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: ["ipad-widget/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"  # hourly: refresh the economic calendar and chart analysis

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: |
          python3 ipad-widget/build.py
          mkdir -p _site
          cp ipad-widget/ipad.html _site/index.html
          cp ipad-widget/icon.png _site/icon.png
      - name: Fetch economic calendar
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0 (TradeDeskWidget)" \
            https://nfs.faireconomy.media/ff_calendar_thisweek.json -o calendar.json
          python3 -c "import json;d=json.load(open('calendar.json'));assert isinstance(d,list);print(len(d),'events')"
          mv calendar.json _site/calendar.json
      - name: Fetch prices and build chart analysis
        continue-on-error: true
        run: python3 ipad-widget/analyze.py _site/market.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
