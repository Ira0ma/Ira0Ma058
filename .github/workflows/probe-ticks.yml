name: Probe real-time price sources (temporary)

on:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: [".github/workflows/probe-ticks.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: pip install websockets
      - name: REST sources (CORS header, how often the value changes)
        run: |
          for u in "https://forex-api.coin.z.com/public/v1/ticker" \
                   "https://api.gold-api.com/price/XAU" \
                   "https://api.coinbase.com/v2/exchange-rates?currency=USD" \
                   "https://api.kraken.com/0/public/Ticker?pair=PAXGUSD,XAUTUSD,USDTJPY" \
                   "https://www.okx.com/api/v5/market/ticker?instId=XAUT-USDT" \
                   "https://api-pub.bitfinex.com/v2/tickers?symbols=tXAUT:USD,tPAXG:USD"; do
            echo "=== $u"
            curl -s -m 15 -D h.txt -o b.txt -H "Origin: https://ira0ma.github.io" "$u" -w "status %{http_code} %{time_total}s\n"
            grep -i "access-control-allow-origin\|ratelimit\|retry-after" h.txt || echo "(no CORS header)"
            head -c 600 b.txt; echo
          done
          echo "=== value changes over 30 s"
          for i in 1 2 3 4 5 6 7; do
            g=$(curl -s https://api.gold-api.com/price/XAU | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('price'),d.get('updatedAt'))")
            c=$(curl -s "https://api.coinbase.com/v2/exchange-rates?currency=USD" | python3 -c "import json,sys;print(json.load(sys.stdin)['data']['rates']['JPY'])")
            m=$(curl -s https://forex-api.coin.z.com/public/v1/ticker | python3 -c "import json,sys;d=json.load(sys.stdin);print([ (x['symbol'],x['bid'],x['timestamp']) for x in d.get('data',[]) if x['symbol']=='USD_JPY'])")
            echo "$(date -u +%T) gold-api $g | coinbase $c | gmo $m"; sleep 4
          done
      - name: WebSocket sources (ticks in 20 s)
        run: |
          python3 - <<'PY'
          import asyncio, json, time, websockets
          async def run(name, url, subs, n=20):
              t0=time.time(); got=[]
              try:
                  async with websockets.connect(url, open_timeout=10) as ws:
                      for s in subs: await ws.send(json.dumps(s)); await asyncio.sleep(1.1)
                      while time.time()-t0<20 and len(got)<n:
                          try: m=await asyncio.wait_for(ws.recv(),timeout=20-(time.time()-t0))
                          except asyncio.TimeoutError: break
                          got.append((round(time.time()-t0,1), m[:160]))
              except Exception as e:
                  print(name,"FAILED",repr(e)[:200]); return
              print(name, len(got), "messages"); [print("  ",x) for x in got[:8]]
          async def main():
              await asyncio.gather(
                run("GMO FX USD_JPY","wss://forex-api.coin.z.com/ws/public/v1",[{"command":"subscribe","channel":"ticker","symbol":"USD_JPY"}]),
                run("Kraken PAXG/USD","wss://ws.kraken.com/v2",[{"method":"subscribe","params":{"channel":"ticker","symbol":["PAXG/USD","XAUT/USD"]}}]),
                run("OKX XAUT-USDT","wss://ws.okx.com:8443/ws/v5/public",[{"op":"subscribe","args":[{"channel":"tickers","instId":"XAUT-USDT"}]}]),
                run("Bitfinex XAUT","wss://api-pub.bitfinex.com/ws/2",[{"event":"subscribe","channel":"ticker","symbol":"tXAUT:USD"}]),
              )
          asyncio.run(main())
          PY
