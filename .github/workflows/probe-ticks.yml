name: Probe XAUT 1-minute candles (temporary)
on:
  push:
    branches: [claude/amazon-affiliate-articles]
    paths: [".github/workflows/probe-ticks.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.okx.com/api/v5/market/candles?instId=XAUT-USDT&bar=1m&limit=30" \
                   "https://api-pub.bitfinex.com/v2/candles/trade:1m:tXAUT:USD/hist?limit=30" \
                   "https://api.kraken.com/0/public/OHLC?pair=PAXGUSD&interval=1"; do
            echo "=== $u"; curl -s -m 15 -D h.txt -o b.txt -H "Origin: https://ira0ma.github.io" "$u" -w "status %{http_code}\n"
            grep -i "access-control-allow-origin" h.txt || echo "(no CORS header)"; head -c 1500 b.txt; echo
          done
          curl -s https://api.gold-api.com/price/XAU; echo; date -u
