<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="個人事業主か法人かの判断のフローチャート（利益の安定・取引先の要請・人を雇うか）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">個人事業主か法人か：判断のフローチャート（目安）</text><rect x="30" y="56" width="240" height="60" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="150" y="81" class="axis" text-anchor="middle" style="fill:#173042;font-size:13.5px;font-weight:bold">利益が安定して</text><text x="150" y="101" class="axis" text-anchor="middle" style="fill:#173042;font-size:13.5px;font-weight:bold">大きくなってきた？</text><rect x="330" y="56" width="240" height="60" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="450" y="81" class="axis" text-anchor="middle" style="fill:#173042;font-size:13.5px;font-weight:bold">取引先から</text><text x="450" y="101" class="axis" text-anchor="middle" style="fill:#173042;font-size:13.5px;font-weight:bold">法人を求められている？</text><rect x="630" y="56" width="240" height="60" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="750" y="81" class="axis" text-anchor="middle" style="fill:#173042;font-size:13.5px;font-weight:bold">人を雇う・事業を</text><text x="750" y="101" class="axis" text-anchor="middle" style="fill:#173042;font-size:13.5px;font-weight:bold">広げる予定がある？</text><line x1="270" y1="86" x2="327" y2="86" stroke="#607481" stroke-width="2"/><path d="M318.9 89.9 L327 86 L318.9 82.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="298" y="78" class="axis" text-anchor="middle" style="fill:#3a6fd8;font-size:12px;font-weight:bold">いいえ</text><line x1="570" y1="86" x2="627" y2="86" stroke="#607481" stroke-width="2"/><path d="M618.9 89.9 L627 86 L618.9 82.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="598" y="78" class="axis" text-anchor="middle" style="fill:#3a6fd8;font-size:12px;font-weight:bold">いいえ</text><line x1="150" y1="116" x2="150" y2="190" stroke="#607481" stroke-width="2"/><path d="M146.1 181.9 L150 190 L153.9 181.9" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="160" class="axis" style="fill:#2f9e64;font-size:13px;font-weight:bold">はい</text><line x1="450" y1="116" x2="450" y2="190" stroke="#607481" stroke-width="2"/><path d="M446.1 181.9 L450 190 L453.9 181.9" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="460" y="160" class="axis" style="fill:#2f9e64;font-size:13px;font-weight:bold">はい</text><line x1="680" y1="116" x2="560" y2="190" stroke="#607481" stroke-width="2"/><path d="M564.8 182.4 L560 190 L569.0 189.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="630" y="146" class="axis" style="fill:#2f9e64;font-size:13px;font-weight:bold">はい</text><line x1="800" y1="116" x2="800" y2="190" stroke="#607481" stroke-width="2"/><path d="M796.1 181.9 L800 190 L803.9 181.9" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="810" y="160" class="axis" style="fill:#3a6fd8;font-size:12px;font-weight:bold">いいえ</text><rect x="30" y="192" width="250" height="60" rx="12" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="155" y="217" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:13.5px;font-weight:bold">法人化を試算する</text><text x="155" y="237" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:13.5px;font-weight:bold">（自分の数字で・専門家に相談）</text><rect x="325" y="192" width="250" height="60" rx="12" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="450" y="217" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:13.5px;font-weight:bold">法人を含めて検討</text><text x="450" y="237" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:13.5px;font-weight:bold">（相手の条件・計画を確かめる）</text><rect x="620" y="192" width="250" height="60" rx="12" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><text x="745" y="217" class="axis" text-anchor="middle" style="fill:#2f9e64;font-size:13px;font-weight:bold">個人事業主で始める</text><text x="745" y="237" class="axis" text-anchor="middle" style="fill:#2f9e64;font-size:13px;font-weight:bold">（あとから法人成りもできる）</text><text x="30" y="282" class="axis" style="fill:#607481;font-size:12px">※ どの分岐も一般的な目安で、断定ではない。家族構成・ほかの所得・社会保険料も含めて自分の数字で試算する</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>