"208" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:12.5px;font-weight:bold">給付制限が解除 → 基本手当の対象</text><text x="30" y="286" class="axis" style="fill:#607481;font-size:11.5px">※ 5年間に正当な理由のない自己都合退職が2回以上で受給資格決定を受けた場合（3回目以降）や、重責解雇は給付制限3か月。振り込みは各認定日のあと</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>