<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="退職のときに会社から受け取る書類のチェック図（離職票・雇用保険被保険者証・源泉徴収票・資格喪失証明書・年金の番号の書類）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">退職のときに受け取る書類のチェック（受け取ったら□に印）</text><rect x="30" y="44" width="840" height="28" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="72" y="63" class="point" style="font-size:14px">受け取る書類</text><text x="342" y="63" class="point" style="font-size:14px">使うところ</text><text x="612" y="63" class="point" style="font-size:14px">届き方の目安</text><rect x="30" y="80" width="840" height="36" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="44" y="89" width="18" height="18" rx="4" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="72" y="103" class="axis" style="fill:#d24b4b;font-size:14px;font-weight:bold">離職票（1・2）</text><text x="342" y="103" class="axis" style="fill:#173042;font-size:13.5px">失業保険（基本手当）の手続き</text><text x="612" y="103" class="axis" style="fill:#607481;font-size:12.5px">退職後に郵送が多い（発行を頼む）</text><rect x="30" y="122" width="840" height="36" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="44" y="131" width="18" height="18" rx="4" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><text x="72" y="145" class="axis" style="fill:#3a6fd8;font-size:14px;font-weight:bold">雇用保険被保険者証</text><text x="342" y="145" class="axis" style="fill:#173042;font-size:13.5px">次の会社の雇用保険など</text><text x="612" y="145" class="axis" style="fill:#607481;font-size:12.5px">退職時に渡されることが多い</text><rect x="30" y="164" width="840" height="36" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="44" y="173" width="18" height="18" rx="4" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><text x="72" y="187" class="axis" style="fill:#3a6fd8;font-size:14px;font-weight:bold">源泉徴収票</text><text x="342" y="187" class="axis" style="fill:#173042;font-size:13.5px">退職した年の確定申告・次の年末調整</text><text x="612" y="187" class="axis" style="fill:#607481;font-size:12.5px">退職後に交付</text><rect x="30" y="206" width="840" height="36" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="44" y="215" width="18" height="18" rx="4" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><text x="72" y="229" class="axis" style="fill:#2f9e64;font-size:14px;font-weight:bold">健康保険の資格喪失証明書</text><text x="342" y="229" class="axis" style="fill:#173042;font-size:13.5px">国民健康保険などへの切り替え</text><text x="612" y="229" class="axis" style="fill:#607481;font-size:12.5px">退職時・退職後（頼んで出してもらう）</text><rect x="30" y="248" width="840" height="36" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="44" y="257" width="18" height="18" rx="4" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="72" y="271" class="axis" style="fill:#b98a32;font-size:14px;font-weight:bold">基礎年金番号通知書・年金手帳</text><text x="342" y="271" class="axis" style="fill:#173042;font-size:13.5px">国民年金への切り替え</text><text x="612" y="271" class="axis" style="fill:#607481;font-size:12.5px">会社に預けていれば返してもらう</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>