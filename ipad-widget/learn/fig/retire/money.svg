<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="退職後のお金カレンダー（住民税・国民健康保険料・国民年金がいつ・どう来るか。執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">退職後のお金カレンダー（後から来るお金）</text><rect x="201.0" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="218.33333333333334" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">9月</text><rect x="237.7" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="255.0" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">10月</text><rect x="274.3" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="291.6666666666667" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">11月</text><rect x="311.0" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="328.33333333333337" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">12月</text><rect x="347.7" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="365.0" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">1月</text><rect x="384.3" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="401.66666666666663" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">2月</text><rect x="421.0" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="438.33333333333337" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">3月</text><rect x="457.7" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="475.0" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">4月</text><rect x="494.3" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="511.6666666666667" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">5月</text><rect x="531.0" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="548.3333333333333" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">6月</text><rect x="567.7" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="585.0" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">7月</text><rect x="604.3" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="621.6666666666667" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">8月</text><rect x="641.0" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="658.3333333333333" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">9月</text><rect x="677.7" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="695.0" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">10月</text><rect x="714.3" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="731.6666666666666" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">11月</text><rect x="751.0" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="768.3333333333334" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">12月</text><rect x="787.7" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="805.0" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">1月</text><rect x="824.3" y="50" width="34.7" height="22" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="841.6666666666666" y="66" class="axis" text-anchor="middle" style="font-size:11.5px">2月</text><text x="218.33333333333334" y="44" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:12px;font-weight:bold">退職</text><text x="365.0" y="44" class="axis" text-anchor="middle" style="fill:#607481;font-size:12px">翌年</text><text x="30" y="111" class="axis" style="fill:#173042;font-size:14px;font-weight:bold">住民税</text><rect x="201.0" y="90" width="34.7" height="32" rx="6" fill="#b98a32" opacity=".85"/><text x="244.66666666666666" y="111" class="axis" style="fill:#b98a32;font-size:12px;font-weight:bold">残りを最後の給与から／普通徴収へ</text><rect x="531.0" y="90" width="328.0" height="32" rx="6" fill="#d24b4b" opacity=".85"/><text x="695.0" y="111" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:12px;font-weight:bold">翌年6月〜：会社にいた年の分が届く</text><text x="30" y="159" class="axis" style="fill:#173042;font-size:14px;font-weight:bold">国民健康保険料</text><rect x="237.7" y="138" width="621.3" height="32" rx="6" fill="#2f9e64" opacity=".85"/><text x="548.3333333333334" y="159" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:12px;font-weight:bold">退職の翌月〜：前の年の所得で計算（軽減・減免は窓口へ）</text><text x="30" y="207" class="axis" style="fill:#173042;font-size:14px;font-weight:bold">国民年金</text><rect x="237.7" y="186" width="621.3" height="32" rx="6" fill="#3a6fd8" opacity=".85"/><text x="548.3333333333334" y="207" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:12px;font-weight:bold">退職の翌月分から：毎月の定額（免除・納付猶予は申請で）</text><text x="30" y="255" class="axis" style="fill:#173042;font-size:14px;font-weight:bold">確定申告</text><rect x="384.3" y="234" width="71.3" height="32" rx="6" fill="#173042" opacity=".85"/><text x="464.6666666666667" y="255" class="axis" style="fill:#173042;font-size:12px;font-weight:bold">翌年2〜3月：納めすぎた所得税が戻ることも</text><text x="30" y="290" class="axis" style="fill:#607481;font-size:12px">例：9月末に退職し、次の仕事にすぐ就かない場合の一般的な流れ。時期や回数は市区町村・加入先によって違う</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>