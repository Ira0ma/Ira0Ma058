<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="退職後の健康保険の3つの選択肢の比較（任意継続・国民健康保険・家族の扶養。執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">退職後の健康保険：3つの選択肢の比較</text><rect x="30" y="44" width="840" height="30" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="202" y="64" class="point" style="fill:#3a6fd8;font-size:14.5px">任意継続</text><text x="452" y="64" class="point" style="fill:#2f9e64;font-size:14.5px">国民健康保険</text><text x="672" y="64" class="point" style="fill:#b98a32;font-size:14.5px">家族の扶養</text><rect x="30" y="80" width="840" height="32" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="101" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">申し込み</text><text x="202" y="101" class="axis" style="fill:#173042;font-size:13.5px">退職後20日以内</text><text x="452" y="101" class="axis" style="fill:#173042;font-size:13.5px">退職後14日以内が目安</text><text x="672" y="101" class="axis" style="fill:#173042;font-size:13.5px">家族の勤務先へ</text><rect x="30" y="116" width="840" height="32" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="137" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">窓口</text><text x="202" y="137" class="axis" style="fill:#173042;font-size:13.5px">加入していた健康保険</text><text x="452" y="137" class="axis" style="fill:#173042;font-size:13.5px">市区町村</text><text x="672" y="137" class="axis" style="fill:#173042;font-size:13.5px">家族の加入先の健康保険</text><rect x="30" y="152" width="840" height="32" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="173" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">保険料の決まり方</text><text x="202" y="173" class="axis" style="fill:#173042;font-size:12.5px">退職時の標準報酬月額で計算（上限あり）</text><text x="452" y="173" class="axis" style="fill:#173042;font-size:13.5px">前年の所得・世帯の人数など</text><text x="672" y="173" class="axis" style="fill:#173042;font-size:13.5px">本人の保険料はかからない</text><rect x="30" y="188" width="840" height="32" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="209" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">会社の負担分</text><text x="202" y="209" class="axis" style="fill:#173042;font-size:13.5px">なし（全額自分で払う）</text><text x="452" y="209" class="axis" style="fill:#173042;font-size:13.5px">（もともとない）</text><text x="672" y="209" class="axis" style="fill:#173042;font-size:13.5px">—</text><rect x="30" y="224" width="840" height="32" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="245" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">家族の分</text><text x="202" y="245" class="axis" style="fill:#173042;font-size:13.5px">扶養したまま続けられる</text><text x="452" y="245" class="axis" style="fill:#173042;font-size:13.5px">人数に応じて計算</text><text x="672" y="245" class="axis" style="fill:#173042;font-size:13.5px">—</text><rect x="30" y="260" width="840" height="32" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="281" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">主な条件・期間</text><text x="202" y="281" class="axis" style="fill:#173042;font-size:13.5px">2か月以上加入・最長2年</text><text x="452" y="281" class="axis" style="fill:#173042;font-size:13.5px">会社都合などは軽減の制度</text><text x="672" y="281" class="axis" style="fill:#173042;font-size:13.5px">収入の見込み130万円未満など</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>