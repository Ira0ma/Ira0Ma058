<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="失業保険（基本手当）の手続きの流れ（離職票・求職の申し込み・待期・説明会・給付制限・認定日のくり返し）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">失業保険（雇用保険の基本手当）の流れ</text><rect x="30" y="52" width="150" height="84" rx="12" fill="#ffffff" stroke="#607481" stroke-width="2"/><text x="105.0" y="84" class="point" text-anchor="middle" style="fill:#607481;font-size:14px">離職票が届く</text><text x="105.0" y="112" class="axis" text-anchor="middle" style="fill:#173042;font-size:12px">会社から（郵送が多い）</text><line x1="182" y1="94" x2="200" y2="94" stroke="#607481" stroke-width="2"/><path d="M191.9 97.9 L200 94 L191.9 90.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="202" y="52" width="150" height="84" rx="12" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><text x="277.0" y="84" class="point" text-anchor="middle" style="fill:#3a6fd8;font-size:13px">ハローワークで手続き</text><text x="277.0" y="112" class="axis" text-anchor="middle" style="fill:#173042;font-size:12px">求職の申し込み・離職票</text><line x1="354" y1="94" x2="372" y2="94" stroke="#607481" stroke-width="2"/><path d="M363.9 97.9 L372 94 L363.9 90.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="52" width="150" height="84" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="449.0" y="84" class="point" text-anchor="middle" style="fill:#b98a32;font-size:14px">待期 7日間</text><text x="449.0" y="112" class="axis" text-anchor="middle" style="fill:#173042;font-size:12px">全員にある</text><line x1="526" y1="94" x2="544" y2="94" stroke="#607481" stroke-width="2"/><path d="M535.9 97.9 L544 94 L535.9 90.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="546" y="52" width="150" height="84" rx="12" fill="#ffffff" stroke="#173042" stroke-width="2"/><text x="621.0" y="84" class="point" text-anchor="middle" style="fill:#173042;font-size:14px">説明会</text><text x="621.0" y="112" class="axis" text-anchor="middle" style="fill:#173042;font-size:12px">受給資格者証を受け取る</text><line x1="698" y1="94" x2="716" y2="94" stroke="#607481" stroke-width="2"/><path d="M707.9 97.9 L716 94 L707.9 90.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="718" y="52" width="150" height="84" rx="12" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="793.0" y="84" class="point" text-anchor="middle" style="fill:#d24b4b;font-size:14px">給付制限</text><text x="793.0" y="112" class="axis" text-anchor="middle" style="fill:#173042;font-size:12px">自己都合などの場合</text><line x1="450" y1="140" x2="450" y2="168" stroke="#607481" stroke-width="2"/><path d="M446.1 159.9 L450 168 L453.9 159.9" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="170" width="600" height="76" rx="14" fill="#f2f7f4" stroke="#2f9e64" stroke-width="2"/><text x="450" y="198" class="point" text-anchor="middle" style="fill:#2f9e64;font-size:15px">認定日（原則4週間に1回）→ 失業の認定 → 振り込み</text><text x="450" y="224" class="axis" text-anchor="middle" style="fill:#173042;font-size:13.5px">求職活動の実績と、働いた日・収入をそのつど申告する（くり返し）</text><path d="M760 190 C 820 190 820 230 760 230" fill="none" stroke="#2f9e64" stroke-width="2"/><line x1="780" y1="229" x2="761" y2="230" stroke="#2f9e64" stroke-width="2"/><path d="M768.9 225.7 L761 230 L769.3 233.5" fill="none" stroke="#2f9e64" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="276" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:13px;font-weight:bold">受給期間は原則、離職の翌日から1年。手続きが遅れると、残りの日数があっても1年を過ぎた分は受け取れない</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>