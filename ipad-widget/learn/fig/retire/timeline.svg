<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="退職前後の手続きタイムライン（退職1か月前〜退職後3か月。執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">退職前後の手続きタイムライン</text><rect x="40" y="70" width="820" height="8" rx="3" fill="#e3eaee"/><line x1="40.0" x2="40.0" y1="62" y2="86" stroke="#9fb0ba" stroke-width="1"/><text x="40.0" y="56" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">1か月前</text><line x1="245.0" x2="245.0" y1="62" y2="86" stroke="#d24b4b" stroke-width="2"/><text x="245.0" y="56" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:12.5px;font-weight:bold">退職日</text><line x1="450.0" x2="450.0" y1="62" y2="86" stroke="#9fb0ba" stroke-width="1"/><text x="450.0" y="56" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">1か月後</text><line x1="655.0" x2="655.0" y1="62" y2="86" stroke="#9fb0ba" stroke-width="1"/><text x="655.0" y="56" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">2か月後</text><line x1="860.0" x2="860.0" y1="62" y2="86" stroke="#9fb0ba" stroke-width="1"/><text x="860.0" y="56" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">3か月後</text><rect x="40.0" y="94" width="198.2" height="22" rx="5" fill="#b98a32" opacity=".85"/><text x="246.16666666666666" y="110" class="axis" style="fill:#b98a32;font-size:12px;font-weight:bold">退職日・有給・保険の比較・離職票を頼む</text><rect x="251.8" y="122" width="88.8" height="22" rx="5" fill="#2f9e64" opacity=".85"/><text x="348.6666666666667" y="138" class="axis" style="fill:#2f9e64;font-size:12px;font-weight:bold">国民年金・国保の切り替え（14日目安）</text><rect x="251.8" y="150" width="129.8" height="22" rx="5" fill="#3a6fd8" opacity=".85"/><text x="389.6666666666667" y="166" class="axis" style="fill:#3a6fd8;font-size:12px;font-weight:bold">任意継続の申し出（20日以内）</text><rect x="292.8" y="178" width="95.7" height="22" rx="5" fill="#d24b4b" opacity=".85"/><text x="396.5" y="194" class="axis" style="fill:#d24b4b;font-size:12px;font-weight:bold">離職票が届く → ハローワークで求職申込み</text><rect x="388.5" y="206" width="471.5" height="22" rx="5" fill="#173042" opacity=".85"/><text x="624.25" y="222" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:12px;font-weight:bold">約4週ごとの認定日（求職活動・働いた日の申告）</text><rect x="518.3" y="234" width="341.7" height="22" rx="5" fill="#607481" opacity=".85"/><text x="689.1666666666666" y="250" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:12px;font-weight:bold">住民税の普通徴収の納付書・保険料の通知</text><text x="40" y="296" class="axis" style="fill:#607481;font-size:12px">巻末のチェックシートと同じ順番。期限は執筆時点の目安で、手続きごとに窓口の案内で確かめる</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>