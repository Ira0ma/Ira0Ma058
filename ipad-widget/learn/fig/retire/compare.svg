<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="個人事業主と法人の徹底比較表（税金・社会保険・信用・手間と費用・やめるとき。執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">個人事業主と法人の徹底比較（目安）</text><rect x="30" y="44" width="840" height="28" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="192" y="63" class="point" style="fill:#2f9e64;font-size:14px">個人事業主</text><text x="492" y="63" class="point" style="fill:#3a6fd8;font-size:14px">法人（株式会社・合同会社）</text><rect x="30" y="76" width="840" height="25" rx="5" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="93" class="axis" style="fill:#173042;font-size:13px;font-weight:bold">税金</text><text x="192" y="93" class="axis" style="fill:#173042;font-size:12.5px">所得税（累進）＋住民税</text><text x="492" y="93" class="axis" style="fill:#173042;font-size:12.5px">法人税など＋役員報酬に所得税（二段構え）</text><rect x="30" y="104" width="840" height="25" rx="5" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="121" class="axis" style="fill:#173042;font-size:13px;font-weight:bold">赤字の持ち越し</text><text x="192" y="121" class="axis" style="fill:#173042;font-size:12.5px">青色申告で3年</text><text x="492" y="121" class="axis" style="fill:#173042;font-size:12.5px">10年</text><rect x="30" y="132" width="840" height="25" rx="5" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="149" class="axis" style="fill:#173042;font-size:13px;font-weight:bold">赤字でもかかる税</text><text x="192" y="149" class="axis" style="fill:#173042;font-size:12.5px">なし</text><text x="492" y="149" class="axis" style="fill:#173042;font-size:12.5px">均等割（年7万円程度〜）</text><rect x="30" y="160" width="840" height="25" rx="5" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="177" class="axis" style="fill:#173042;font-size:13px;font-weight:bold">お金の取り出し</text><text x="192" y="177" class="axis" style="fill:#173042;font-size:12.5px">自由（事業のもうけ＝自分の所得）</text><text x="492" y="177" class="axis" style="fill:#173042;font-size:12.5px">役員報酬（原則、毎月決まった額）</text><rect x="30" y="188" width="840" height="25" rx="5" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="205" class="axis" style="fill:#173042;font-size:13px;font-weight:bold">社会保険</text><text x="192" y="205" class="axis" style="fill:#173042;font-size:12.5px">国民年金＋国民健康保険（全額自己負担）</text><text x="492" y="205" class="axis" style="fill:#173042;font-size:12.5px">厚生年金＋健康保険（加入義務・折半）</text><rect x="30" y="216" width="840" height="25" rx="5" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="233" class="axis" style="fill:#173042;font-size:13px;font-weight:bold">信用</text><text x="192" y="233" class="axis" style="fill:#173042;font-size:12.5px">開業届と実績で取引</text><text x="492" y="233" class="axis" style="fill:#173042;font-size:12.5px">登記あり・法人限定の取引にも対応</text><rect x="30" y="244" width="840" height="25" rx="5" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="261" class="axis" style="fill:#173042;font-size:13px;font-weight:bold">始める</text><text x="192" y="261" class="axis" style="fill:#173042;font-size:12.5px">開業届だけ・無料・すぐ</text><text x="492" y="261" class="axis" style="fill:#173042;font-size:12.5px">定款と登記・合同会社6万円台〜/株式会社20万円前後</text><rect x="30" y="272" width="840" height="25" rx="5" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="289" class="axis" style="fill:#173042;font-size:13px;font-weight:bold">やめる</text><text x="192" y="289" class="axis" style="fill:#173042;font-size:12.5px">廃業届など</text><text x="492" y="289" class="axis" style="fill:#173042;font-size:12.5px">解散・清算の手続きと費用</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>