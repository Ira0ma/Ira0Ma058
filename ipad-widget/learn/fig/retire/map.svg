<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="給付金の場面別マップ（場面・制度・窓口。執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">給付金の場面別マップ：場面 → 制度 → 窓口</text><rect x="30" y="44" width="840" height="28" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="44" y="63" class="point" style="font-size:14px">場面</text><text x="214" y="63" class="point" style="font-size:14px">使える制度（主なもの）</text><text x="604" y="63" class="point" style="font-size:14px">窓口</text><rect x="30" y="77" width="840" height="28" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="77" width="6" height="28" rx="3" fill="#3a6fd8"/><text x="44" y="96" class="axis" style="fill:#3a6fd8;font-size:14px;font-weight:bold">失業・転職</text><text x="214" y="96" class="axis" style="fill:#173042;font-size:13.5px">基本手当（失業保険）・再就職手当</text><text x="604" y="96" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">ハローワーク</text><rect x="30" y="108" width="840" height="28" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="108" width="6" height="28" rx="3" fill="#3a6fd8"/><text x="44" y="127" class="axis" style="fill:#3a6fd8;font-size:14px;font-weight:bold">学び直し</text><text x="214" y="127" class="axis" style="fill:#173042;font-size:13.5px">教育訓練給付金・公共職業訓練</text><text x="604" y="127" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">ハローワーク</text><rect x="30" y="139" width="840" height="28" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="139" width="6" height="28" rx="3" fill="#2f9e64"/><text x="44" y="158" class="axis" style="fill:#2f9e64;font-size:14px;font-weight:bold">病気・ケガ</text><text x="214" y="158" class="axis" style="fill:#173042;font-size:13.5px">傷病手当金・高額療養費</text><text x="604" y="158" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">加入している健康保険</text><rect x="30" y="170" width="840" height="28" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="170" width="6" height="28" rx="3" fill="#2f9e64"/><text x="44" y="189" class="axis" style="fill:#2f9e64;font-size:14px;font-weight:bold">出産・子育て</text><text x="214" y="189" class="axis" style="fill:#173042;font-size:13.5px">出産育児一時金・出産手当金・児童手当</text><text x="604" y="189" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">健康保険・市区町村</text><rect x="30" y="201" width="840" height="28" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="201" width="6" height="28" rx="3" fill="#3a6fd8"/><text x="44" y="220" class="axis" style="fill:#3a6fd8;font-size:14px;font-weight:bold">介護</text><text x="214" y="220" class="axis" style="fill:#173042;font-size:13.5px">介護休業給付</text><text x="604" y="220" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">勤務先・ハローワーク</text><rect x="30" y="232" width="840" height="28" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="232" width="6" height="28" rx="3" fill="#b98a32"/><text x="44" y="251" class="axis" style="fill:#b98a32;font-size:14px;font-weight:bold">住まい</text><text x="214" y="251" class="axis" style="fill:#173042;font-size:13.5px">住居確保給付金</text><text x="604" y="251" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">市区町村（相談窓口）</text><rect x="30" y="263" width="840" height="28" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="263" width="6" height="28" rx="3" fill="#b98a32"/><text x="44" y="282" class="axis" style="fill:#b98a32;font-size:14px;font-weight:bold">保険料・年金</text><text x="214" y="282" class="axis" style="fill:#173042;font-size:13.5px">国民健康保険料の軽減・国民年金の免除</text><text x="604" y="282" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">市区町村・年金事務所</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年度）による模式図。手続きの前にハローワーク・年金事務所・加入先の健康保険などの公式情報で確認してください</text></svg>