<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="％の差は「パーセントポイント」で表す"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#4765cc}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">％の差は「パーセントポイント」で表す</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">市場予想：3.0％</text><text x="64" y="151" class="axis">仮の前年比予想</text><text x="64" y="190" class="axis">比較する項目をそろえる</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">発表結果：3.2％</text><text x="484" y="151" class="axis">予想より0.2ポイント高い</text><text x="484" y="190" class="axis">方向は内訳や期待でも変わる</text></svg>