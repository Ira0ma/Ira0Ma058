<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="計算のつながり"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#4765cc}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="55" y="70" class="point">持ち越しの受取りと、為替の損失を足す</text><rect x="50" y="102" width="800" height="95" rx="10" fill="#ffffff" stroke="none"/><text x="75" y="157" class="point">＋100円 − 2,000円 ＝ −1,900円</text><text x="60" y="251" class="axis">スワップがプラスでも、合計でマイナスになる例。</text></svg>