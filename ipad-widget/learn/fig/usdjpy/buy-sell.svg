<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="数量とコストを除いた、価格差の向き"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#4765cc}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">数量とコストを除いた、価格差の向き</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">買い：150 → 151</text><text x="64" y="151" class="axis">上がると利益方向</text><text x="64" y="190" class="axis">150 → 149なら損失方向</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">売り：150 → 149</text><text x="484" y="151" class="axis">下がると利益方向</text><text x="484" y="190" class="axis">150 → 151なら損失方向</text></svg>