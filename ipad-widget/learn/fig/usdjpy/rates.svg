<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="為替は現在の差だけで決まらない"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#4765cc}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">為替は現在の差だけで決まらない</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">いまの金利差</text><text x="64" y="151" class="axis">現在の政策金利</text><text x="64" y="190" class="axis">市場金利の水準</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">これからの期待</text><text x="484" y="151" class="axis">次の利上げ・利下げ予想</text><text x="484" y="190" class="axis">予想がどう変わったか</text></svg>