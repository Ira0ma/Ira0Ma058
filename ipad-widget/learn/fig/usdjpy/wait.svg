<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="取引しない日も、学習はできる"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#4765cc}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">取引しない日も、学習はできる</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">見送る理由の例</text><text x="64" y="151" class="axis">指標の直前</text><text x="64" y="190" class="axis">コスト拡大／根拠が曖昧</text><text x="64" y="229" class="axis">取り返したい気持ち</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">待っている間にできること</text><text x="484" y="151" class="axis">過去チャートを観察</text><text x="484" y="190" class="axis">失敗例も記録</text><text x="484" y="229" class="axis">取引条件を確認</text></svg>