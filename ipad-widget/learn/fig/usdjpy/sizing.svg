<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="幅が広いほど、同じ予定損失なら数量を減らす"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#4765cc}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">幅が広いほど、同じ予定損失なら数量を減らす</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">許容損失1,000円／20pips</text><text x="64" y="151" class="axis">幅0.20円</text><text x="64" y="190" class="axis">1,000 ÷ 0.20＝5,000ドル</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">許容損失1,000円／50pips</text><text x="484" y="151" class="axis">幅0.50円</text><text x="484" y="190" class="axis">1,000 ÷ 0.50＝2,000ドル</text></svg>