<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="必要額の早見図（年間の支出と、フルFIREの必要額の目安・サイドFIREの目安）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.point{font-size:16px;fill:#173042;font-weight:bold}.axis{font-size:14px;fill:#173042}.sub{font-size:12.5px;fill:#607481}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="400" rx="16" fill="#f4f7f8"/><text x="30" y="36" class="point">必要額の早見図：年間の支出 ×25 が目安（フルFIRE）</text><text x="30" y="60" class="sub">薄い色のバー全体がフルFIREの必要額、濃い部分の端（半分）がサイドFIREの目安です。金色の行はサンプル人物Aさん（年支出360万円）です。</text><text x="30" y="109" class="axis">年240万円</text><rect x="105" y="92" width="312" height="24" rx="6" fill="#b9cdd6"/><rect x="105" y="92" width="156" height="24" rx="6" fill="#5b7d8c"/><text x="427" y="109" class="axis">6,000万円</text><text x="261" y="132" class="sub" text-anchor="middle">半分 3,000万円</text><text x="30" y="165" class="axis">年300万円</text><rect x="105" y="148" width="390" height="24" rx="6" fill="#b9cdd6"/><rect x="105" y="148" width="195" height="24" rx="6" fill="#5b7d8c"/><text x="505" y="165" class="axis">7,500万円</text><text x="300" y="188" class="sub" text-anchor="middle">半分 3,750万円</text><text x="30" y="221" class="axis">年360万円</text><rect x="105" y="204" width="468" height="24" rx="6" fill="#e2703a"/><rect x="105" y="204" width="234" height="24" rx="6" fill="#93400f"/><text x="583" y="221" class="axis">9,000万円</text><text x="339" y="244" class="sub" text-anchor="middle">半分 4,500万円</text><text x="30" y="277" class="axis">年480万円</text><rect x="105" y="260" width="624" height="24" rx="6" fill="#b9cdd6"/><rect x="105" y="260" width="312" height="24" rx="6" fill="#5b7d8c"/><text x="739" y="277" class="axis">12,000万円</text><text x="417" y="300" class="sub" text-anchor="middle">半分 6,000万円</text><text x="30" y="333" class="axis">年600万円</text><rect x="105" y="316" width="780" height="24" rx="6" fill="#b9cdd6"/><rect x="105" y="316" width="390" height="24" rx="6" fill="#5b7d8c"/><text x="877" y="333" class="axis" text-anchor="end">15,000万円</text><text x="495" y="356" class="sub" text-anchor="middle">半分 7,500万円</text><text x="30" y="382" class="foot">※ 数字は「年支出×25」という目安の置き方による計算例です。必要額は暮らし方で変わり、成果を保証するものではありません。</text></svg>