<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="年代別のコア比率の目安（一般論のレンジ）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.point{font-size:16px;fill:#173042;font-weight:bold}.axis{font-size:14px;fill:#173042}.sub{font-size:12.5px;fill:#607481}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="400" rx="16" fill="#f4f7f8"/><text x="30" y="36" class="point">年代別のコア（土台）比率の目安 ― 一般論のレンジ</text><text x="30" y="60" class="sub">濃い部分がコア（土台）の比率の目安、右の薄い部分がサテライト（上乗せ）の上限の目安です。</text><line x1="90" y1="78" x2="90" y2="322" stroke="#d5dee3" stroke-width="1"/><text x="90" y="342" class="sub" text-anchor="middle">0%</text><line x1="275" y1="78" x2="275" y2="322" stroke="#d5dee3" stroke-width="1"/><text x="275" y="342" class="sub" text-anchor="middle">25%</text><line x1="460" y1="78" x2="460" y2="322" stroke="#d5dee3" stroke-width="1"/><text x="460" y="342" class="sub" text-anchor="middle">50%</text><line x1="645" y1="78" x2="645" y2="322" stroke="#d5dee3" stroke-width="1"/><text x="645" y="342" class="sub" text-anchor="middle">75%</text><line x1="830" y1="78" x2="830" y2="322" stroke="#d5dee3" stroke-width="1"/><text x="830" y="342" class="sub" text-anchor="middle">100%</text><text x="30" y="106" class="axis">30代</text><rect x="90" y="88" width="740" height="26" rx="6" fill="#e3ebef"/><rect x="682" y="88" width="74" height="26" rx="6" fill="#e2703a"/><text x="766" y="106" class="axis">コア 80〜90％</text><text x="30" y="154" class="axis">40代</text><rect x="90" y="136" width="740" height="26" rx="6" fill="#e3ebef"/><rect x="645" y="136" width="74" height="26" rx="6" fill="#e2703a"/><text x="729" y="154" class="axis">コア 75〜85％</text><text x="30" y="202" class="axis">50代</text><rect x="90" y="184" width="740" height="26" rx="6" fill="#e3ebef"/><rect x="608" y="184" width="74" height="26" rx="6" fill="#e2703a"/><text x="692" y="202" class="axis">コア 70〜80％</text><text x="30" y="250" class="axis">60代</text><rect x="90" y="232" width="740" height="26" rx="6" fill="#e3ebef"/><rect x="534" y="232" width="74" height="26" rx="6" fill="#e2703a"/><text x="618" y="250" class="axis">コア 60〜70％</text><text x="30" y="298" class="axis">65歳〜</text><rect x="90" y="280" width="740" height="26" rx="6" fill="#e3ebef"/><rect x="460" y="280" width="111" height="26" rx="6" fill="#e2703a"/><text x="581" y="298" class="axis">コア 50〜65％</text><text x="30" y="382" class="foot">※ 比率は考え方の一つとしての目安です。収入の安定度・家族構成・本人の感覚で変わります。断定するものではありません。</text></svg>