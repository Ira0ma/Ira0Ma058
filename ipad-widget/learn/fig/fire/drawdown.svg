<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="取り崩しの順番図（現金・課税口座・NISA・iDeCoと年金の順）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.point{font-size:16px;fill:#173042;font-weight:bold}.bt{font-size:15.5px;fill:#173042;font-weight:bold}.sub{font-size:12.5px;fill:#607481}.bsub{font-size:12px;fill:#3d5566}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="400" rx="16" fill="#f4f7f8"/><text x="30" y="36" class="point">取り崩しの順番の考え方 ― 基本の流れ</text><text x="30" y="60" class="sub">順番は「税金の不利が小さいもの・自由に動かせるもの」からが基本の1つです。人によって合う順番は変わります。</text><rect x="30" y="90" width="192" height="104" rx="10" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="42" y="120" class="bt">1. 現金・預金</text><text x="42" y="146" class="bsub">防衛資金を超えた分から</text><text x="42" y="166" class="bsub">取り崩す</text><text x="226" y="150" class="point">→</text><rect x="244" y="90" width="192" height="104" rx="10" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="256" y="120" class="bt">2. 課税口座の資産</text><text x="256" y="146" class="bsub">特定口座など</text><text x="256" y="166" class="bsub">税金は売却益に原則</text><text x="256" y="186" class="bsub">20.315％（執筆時点）</text><text x="440" y="150" class="point">→</text><rect x="458" y="90" width="192" height="104" rx="10" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="470" y="120" class="bt">3. NISAの資産</text><text x="470" y="146" class="bsub">非課税の箱は、できるだけ</text><text x="470" y="166" class="bsub">長く残すのが考え方の</text><text x="470" y="186" class="bsub">一つ</text><text x="654" y="150" class="point">→</text><rect x="672" y="90" width="192" height="104" rx="10" fill="#fdeee3" stroke="#e2703a" stroke-width="1.5"/><text x="684" y="120" class="bt">4. iDeCo・年金</text><text x="684" y="146" class="bsub">受け取り開始の</text><text x="684" y="166" class="bsub">年齢の壁がある</text><rect x="30" y="226" width="840" height="86" rx="10" fill="#eef3f5" stroke="#c9d5dc"/><text x="44" y="254" class="bt">受け取り開始の「年齢の壁」</text><text x="44" y="278" class="bsub">iDeCo：60歳から75歳の間で受け取り開始を選ぶ（原則60歳まで引き出せない）</text><text x="44" y="300" class="bsub">公的年金：原則65歳。60歳からの繰上げ（月0.4％減）・75歳までの繰下げ（月0.7％増）が選べる</text><text x="30" y="352" class="foot">※ 順番は一般的な考え方の一つです。税金・手数料・家族の状況で変わります。執筆時点の制度です。</text></svg>