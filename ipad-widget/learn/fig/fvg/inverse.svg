<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="IFVGの候補例"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#4765cc}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><rect x="60" y="130" width="770" height="60" rx="10" fill="#e3eafa" stroke="none"/><path d="M60 130H830" fill="none" stroke="#4765cc" stroke-width="2" stroke-dasharray="7 5"/><path d="M60 190H830" fill="none" stroke="#4765cc" stroke-width="2" stroke-dasharray="7 5"/><path d="M80 70L190 105L300 145L400 240L520 188L650 255L790 280" fill="none" stroke="#173042" stroke-width="4"/><text x="90" y="35" class="point">元の強気帯を下抜けた後、戻りが止まる候補例</text><text x="400" y="280" class="point">下抜け</text><text x="540" y="170" class="point">戻りでの反応</text><text x="70" y="319" class="axis">役割転換は自動確定しない。線を抜けた足と、その後を分ける。</text></svg>