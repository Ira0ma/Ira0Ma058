<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="銘柄・時間足・完成時刻をひと組に"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#4765cc}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">銘柄・時間足・完成時刻をひと組に</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">1時間足の帯</text><text x="64" y="151" class="axis">完成日時を保存</text><text x="64" y="190" class="axis">上位足の確定前後を区別</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">5分足の帯</text><text x="484" y="151" class="axis">別の構造として保存</text><text x="484" y="190" class="axis">同じ場所でも同一の帯ではない</text></svg>