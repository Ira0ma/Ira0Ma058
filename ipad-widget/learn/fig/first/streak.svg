<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="勝ち負けが半々の仮定で、100回のうちに何連敗以上が起きるかの確率"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.v{font-size:15px;font-weight:bold}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="34" class="point">勝ち負けが半々と仮定して100回くり返すと、何連敗以上が1回でも起きるかの確率</text><line x1="90" x2="860" y1="270.0" y2="270.0" stroke="#dde5ea"/><text x="80" y="275.0" class="axis" text-anchor="end">0%</text><line x1="90" x2="860" y1="170.0" y2="170.0" stroke="#dde5ea"/><text x="80" y="175.0" class="axis" text-anchor="end">50%</text><line x1="90" x2="860" y1="70.0" y2="70.0" stroke="#dde5ea"/><text x="80" y="75.0" class="axis" text-anchor="end">100%</text><rect x="120" y="75.5" width="60" height="194.5" rx="4" fill="#3a6fd8"/><text x="150" y="68.5" class="v" text-anchor="middle" style="fill:#3a6fd8">約97%</text><text x="150" y="292.0" class="axis" text-anchor="middle">4連敗以上</text><rect x="225" y="108.0" width="60" height="162.0" rx="4" fill="#3a6fd8"/><text x="255" y="101.0" class="v" text-anchor="middle" style="fill:#3a6fd8">約81%</text><text x="255" y="292.0" class="axis" text-anchor="middle">5連敗以上</text><rect x="330" y="160.8" width="60" height="109.2" rx="4" fill="#3a6fd8"/><text x="360" y="153.8" class="v" text-anchor="middle" style="fill:#3a6fd8">約55%</text><text x="360" y="292.0" class="axis" text-anchor="middle">6連敗以上</text><rect x="435" y="206.5" width="60" height="63.5" rx="4" fill="#3a6fd8"/><text x="465" y="199.5" class="v" text-anchor="middle" style="fill:#3a6fd8">約32%</text><text x="465" y="292.0" class="axis" text-anchor="middle">7連敗以上</text><rect x="540" y="236.0" width="60" height="34.0" rx="4" fill="#3a6fd8"/><text x="570" y="229.0" class="v" text-anchor="middle" style="fill:#3a6fd8">約17%</text><text x="570" y="292.0" class="axis" text-anchor="middle">8連敗以上</text><rect x="645" y="252.5" width="60" height="17.5" rx="4" fill="#3a6fd8"/><text x="675" y="245.5" class="v" text-anchor="middle" style="fill:#3a6fd8">約9%</text><text x="675" y="292.0" class="axis" text-anchor="middle">9連敗以上</text><rect x="750" y="261.2" width="60" height="8.8" rx="4" fill="#3a6fd8"/><text x="780" y="254.2" class="v" text-anchor="middle" style="fill:#3a6fd8">約4%</text><text x="780" y="292.0" class="axis" text-anchor="middle">10連敗以上</text><text x="860" y="324" class="axis" text-anchor="end" style="font-size:13px">勝率の目安ではなく、確率の計算例（1回ごとの勝ち負けが独立と仮定）</text></svg>