<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="1年の申告カレンダー（対象の年の記録・集計・申告期間・納付・住民税の通知。執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">1年の申告カレンダー</text><rect x="40.0" y="46" width="542.6666666666666" height="28" rx="8" fill="#e9f3ee" stroke="#2f9e64" stroke-width="1.5"/><text x="313.3333333333333" y="66" class="point" text-anchor="middle" style="fill:#2f9e64;font-size:14px">対象の年（1月1日〜12月31日）</text><rect x="586.6666666666666" y="46" width="273.33333333333337" height="28" rx="8" fill="#fbf3e3" stroke="#b98a32" stroke-width="1.5"/><text x="723.3333333333333" y="66" class="point" text-anchor="middle" style="fill:#b98a32;font-size:14px">翌年</text><rect x="41.0" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="62.77777777777778" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">1月</text><rect x="86.6" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="108.33333333333333" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">2月</text><rect x="132.1" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="153.88888888888889" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">3月</text><rect x="177.7" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="199.44444444444446" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">4月</text><rect x="223.2" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="245.0" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">5月</text><rect x="268.8" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="290.55555555555554" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">6月</text><rect x="314.3" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="336.1111111111111" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">7月</text><rect x="359.9" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="381.6666666666667" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">8月</text><rect x="405.4" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="427.22222222222223" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">9月</text><rect x="451.0" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="472.77777777777777" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">10月</text><rect x="496.6" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="518.3333333333333" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">11月</text><rect x="542.1" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="563.8888888888889" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">12月</text><rect x="587.7" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="609.4444444444445" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">1月</text><rect x="633.2" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="655.0" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">2月</text><rect x="678.8" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="700.5555555555555" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">3月</text><rect x="724.3" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="746.1111111111111" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">4月</text><rect x="769.9" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="791.6666666666666" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">5月</text><rect x="815.4" y="82" width="43.6" height="26" rx="4" fill="#ffffff" stroke="#dde5ea"/><text x="837.2222222222222" y="100" class="axis" text-anchor="middle" style="font-size:12.5px">6月</text><rect x="41.0" y="112" width="544.7" height="20" rx="5" fill="#2f9e64" opacity=".85"/><text x="52.0" y="127" class="axis" style="fill:#ffffff;font-size:13.5px;font-weight:bold">毎月の記録（売上・経費・確定した報酬）</text><rect x="587.7" y="148" width="66.3" height="20" rx="5" fill="#3a6fd8" opacity=".85"/><text x="578.6666666666666" y="163" class="axis" text-anchor="end" style="fill:#3a6fd8;font-size:13.5px;font-weight:bold">締めと集計・明細をそろえる</text><rect x="656.0" y="184" width="43.6" height="20" rx="5" fill="#d24b4b" opacity=".85"/><text x="647.0" y="199" class="axis" text-anchor="end" style="fill:#d24b4b;font-size:13.5px;font-weight:bold">申告期間 2/16〜3/15（原則）</text><rect x="692.4" y="220" width="8.0" height="20" rx="5" fill="#d24b4b" opacity=".85"/><text x="683.4444444444445" y="235" class="axis" text-anchor="end" style="fill:#d24b4b;font-size:13.5px;font-weight:bold">所得税の納付期限 3/15（原則）</text><rect x="769.9" y="256" width="89.1" height="20" rx="5" fill="#b98a32" opacity=".85"/><text x="760.8888888888889" y="271" class="axis" text-anchor="end" style="fill:#b98a32;font-size:13.5px;font-weight:bold">住民税の通知（5〜6月ごろ）</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年分）による模式図。土日祝日と重なると期限は次の平日。年ごとに国税庁の案内で確認してください</text></svg>