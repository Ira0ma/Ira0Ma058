<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="給与・国内FX・海外FX・暗号資産・アフィリエイトなどの収入を、所得の種類に振り分ける図（執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">収入の振り分け：どの所得の種類に当たるか（原則の形）</text><rect x="30" y="52" width="270" height="40" rx="10" fill="#ffffff" stroke="#c9d5dc" stroke-width="1.5"/><text x="165" y="78" class="point" text-anchor="middle" style="font-size:15px">会社の給与</text><line x1="300" y1="72" x2="556" y2="78" stroke="#173042" stroke-width="2"/><path d="M547.8 81.7 L556 78 L548.0 73.9" fill="none" stroke="#173042" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="102" width="270" height="40" rx="10" fill="#ffffff" stroke="#c9d5dc" stroke-width="1.5"/><text x="165" y="128" class="point" text-anchor="middle" style="font-size:15px">国内の業者のFX・CFD</text><line x1="300" y1="122" x2="556" y2="140" stroke="#3a6fd8" stroke-width="2"/><path d="M547.6 143.3 L556 140 L548.2 135.5" fill="none" stroke="#3a6fd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="152" width="270" height="40" rx="10" fill="#ffffff" stroke="#c9d5dc" stroke-width="1.5"/><text x="165" y="178" class="point" text-anchor="middle" style="font-size:15px">海外の業者のFX</text><line x1="300" y1="172" x2="556" y2="202" stroke="#b98a32" stroke-width="2"/><path d="M547.5 204.9 L556 202 L548.4 197.2" fill="none" stroke="#b98a32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="202" width="270" height="40" rx="10" fill="#ffffff" stroke="#c9d5dc" stroke-width="1.5"/><text x="165" y="228" class="point" text-anchor="middle" style="font-size:15px">暗号資産の売買</text><line x1="300" y1="222" x2="556" y2="202" stroke="#b98a32" stroke-width="2"/><path d="M548.2 206.5 L556 202 L547.6 198.7" fill="none" stroke="#b98a32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="252" width="270" height="40" rx="10" fill="#ffffff" stroke="#c9d5dc" stroke-width="1.5"/><text x="165" y="278" class="point" text-anchor="middle" style="font-size:15px">アフィリエイト・note販売</text><line x1="300" y1="272" x2="556" y2="202" stroke="#b98a32" stroke-width="2"/><path d="M549.2 207.9 L556 202 L547.2 200.4" fill="none" stroke="#b98a32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="52" width="310" height="52" rx="10" fill="#ffffff" stroke="#173042" stroke-width="2"/><text x="715" y="74" class="point" text-anchor="middle" style="fill:#173042;font-size:15px">給与所得</text><text x="715" y="94" class="axis" text-anchor="middle" style="font-size:12.5px">年末調整で精算されるのが基本</text><rect x="560" y="114" width="310" height="52" rx="10" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><text x="715" y="136" class="point" text-anchor="middle" style="fill:#3a6fd8;font-size:15px">先物取引に係る雑所得等</text><text x="715" y="156" class="axis" text-anchor="middle" style="font-size:12.5px">申告分離課税</text><rect x="560" y="176" width="310" height="52" rx="10" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="715" y="198" class="point" text-anchor="middle" style="fill:#b98a32;font-size:15px">雑所得</text><text x="715" y="218" class="axis" text-anchor="middle" style="font-size:12.5px">総合課税（ほかの所得と合計）</text><rect x="560" y="238" width="310" height="52" rx="10" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><text x="715" y="260" class="point" text-anchor="middle" style="fill:#2f9e64;font-size:15px">事業所得</text><text x="715" y="280" class="axis" text-anchor="middle" style="font-size:12.5px">総合課税・事業の規模や実態による</text><line x1="300" y1="272" x2="556" y2="264" stroke="#2f9e64" stroke-width="2" stroke-dasharray="6 5"/><text x="430" y="288" class="axis" text-anchor="middle" style="fill:#2f9e64;font-size:12.5px">規模・実態によっては事業所得</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年分）による模式図。提出前に国税庁などの公式情報で確認してください</text></svg>