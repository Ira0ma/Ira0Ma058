<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="所得の種類の組み合わせごとに、損益通算と繰越控除ができるかどうかを示す早見表（執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">損益通算・繰越の早見（○＝できる　×＝できない）</text><rect x="30" y="46" width="840" height="32" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="40" y="67" class="point" style="font-size:14px">損失が出た所得</text><text x="260" y="67" class="point" style="font-size:14px">差し引きたい相手</text><text x="520" y="67" class="point" style="font-size:14px">同じ年（損益通算）</text><text x="680" y="67" class="point" style="font-size:14px">翌年以降（繰越）</text><rect x="30" y="84" width="840" height="38" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="40" y="109" class="axis" style="fill:#173042;font-size:13.5px">国内FX・CFDの損失</text><text x="260" y="109" class="axis" style="fill:#173042;font-size:13.5px">国内FX・CFD・取引所の先物の利益</text><text x="520" y="109" class="axis" style="fill:#2f9e64;font-size:14.5px;font-weight:bold">○</text><text x="680" y="109" class="axis" style="fill:#2f9e64;font-size:14.5px;font-weight:bold">○ 3年（申告を続ける）</text><rect x="30" y="126" width="840" height="38" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="40" y="151" class="axis" style="fill:#173042;font-size:13.5px">国内FX・CFDの損失</text><text x="260" y="151" class="axis" style="fill:#173042;font-size:13.5px">給与・雑所得（総合）の利益</text><text x="520" y="151" class="axis" style="fill:#d24b4b;font-size:14.5px;font-weight:bold">×</text><text x="680" y="151" class="axis" style="fill:#2f9e64;font-size:14.5px;font-weight:bold">○ 国内FX等の利益から</text><rect x="30" y="168" width="840" height="38" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="40" y="193" class="axis" style="fill:#173042;font-size:13.5px">海外FX・暗号資産の損失</text><text x="260" y="193" class="axis" style="fill:#173042;font-size:13.5px">雑所得（総合）の中の利益</text><text x="520" y="193" class="axis" style="fill:#2f9e64;font-size:14.5px;font-weight:bold">○ 雑所得の中で合算</text><text x="680" y="193" class="axis" style="fill:#d24b4b;font-size:14.5px;font-weight:bold">×</text><rect x="30" y="210" width="840" height="38" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="40" y="235" class="axis" style="fill:#173042;font-size:13.5px">海外FX・暗号資産の損失</text><text x="260" y="235" class="axis" style="fill:#173042;font-size:13.5px">給与所得</text><text x="520" y="235" class="axis" style="fill:#d24b4b;font-size:14.5px;font-weight:bold">×</text><text x="680" y="235" class="axis" style="fill:#d24b4b;font-size:14.5px;font-weight:bold">×（切り捨て）</text><rect x="30" y="252" width="840" height="38" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="40" y="277" class="axis" style="fill:#173042;font-size:13.5px">事業所得の赤字</text><text x="260" y="277" class="axis" style="fill:#173042;font-size:13.5px">給与所得</text><text x="520" y="277" class="axis" style="fill:#2f9e64;font-size:14.5px;font-weight:bold">○</text><text x="680" y="277" class="axis" style="fill:#2f9e64;font-size:14.5px;font-weight:bold">青色申告なら○（条件あり）</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年分）による模式図。提出前に国税庁などの公式情報で確認してください</text></svg>