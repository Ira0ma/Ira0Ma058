<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="e-Taxで送る流れ（材料をそろえる・作成コーナーで入力・本人確認・送信・受信通知の保存）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">e-Taxで送る流れ（作成コーナーから送信まで）</text><rect x="30" y="64" width="150" height="128" rx="12" fill="#ffffff" stroke="#607481" stroke-width="2"/><circle cx="105.0" cy="64" r="13" fill="#607481"/><text x="105.0" y="69" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">1</text><text x="105.0" y="108" class="point" text-anchor="middle" style="fill:#607481;font-size:14px">材料をそろえる</text><text x="105.0" y="140" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">源泉徴収票・明細</text><text x="105.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">経費の表・控除の書類</text><line x1="182" y1="128" x2="200" y2="128" stroke="#607481" stroke-width="2"/><path d="M191.9 131.9 L200 128 L191.9 124.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="202" y="64" width="150" height="128" rx="12" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><circle cx="277.0" cy="64" r="13" fill="#3a6fd8"/><text x="277.0" y="69" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">2</text><text x="277.0" y="108" class="point" text-anchor="middle" style="fill:#3a6fd8;font-size:13px">作成コーナーで入力</text><text x="277.0" y="140" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">画面の質問に答える</text><text x="277.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">計算は自動</text><line x1="354" y1="128" x2="372" y2="128" stroke="#607481" stroke-width="2"/><path d="M363.9 131.9 L372 128 L363.9 124.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="64" width="150" height="128" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><circle cx="449.0" cy="64" r="13" fill="#b98a32"/><text x="449.0" y="69" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">3</text><text x="449.0" y="108" class="point" text-anchor="middle" style="fill:#b98a32;font-size:14px">本人確認</text><text x="449.0" y="140" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">マイナンバーカード方式</text><text x="449.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">（またはID・パスワード）</text><line x1="526" y1="128" x2="544" y2="128" stroke="#607481" stroke-width="2"/><path d="M535.9 131.9 L544 128 L535.9 124.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="546" y="64" width="150" height="128" rx="12" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><circle cx="621.0" cy="64" r="13" fill="#2f9e64"/><text x="621.0" y="69" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">4</text><text x="621.0" y="108" class="point" text-anchor="middle" style="fill:#2f9e64;font-size:14px">送信</text><text x="621.0" y="140" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">申告書を送る</text><text x="621.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">納付の方法も選ぶ</text><line x1="698" y1="128" x2="716" y2="128" stroke="#607481" stroke-width="2"/><path d="M707.9 131.9 L716 128 L707.9 124.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="718" y="64" width="150" height="128" rx="12" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><circle cx="793.0" cy="64" r="13" fill="#d24b4b"/><text x="793.0" y="69" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">5</text><text x="793.0" y="108" class="point" text-anchor="middle" style="fill:#d24b4b;font-size:14px">受信通知を保存</text><text x="793.0" y="140" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">受け付けの記録と</text><text x="793.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px">申告書のデータを保存</text><rect x="30" y="214" width="840" height="74" rx="10" fill="#fbf3e3" stroke="#b98a32" stroke-width="1.2"/><text x="48" y="240" class="axis" style="fill:#173042;font-size:13.5px">・マイナンバーカード方式：読み取りに対応したスマホ、またはICカードリーダーで読み取る</text><text x="48" y="266" class="axis" style="fill:#173042;font-size:13.5px">・ID・パスワード方式：暫定的な仕組み。執筆時点では新しい発行が止まっている（既存のIDは利用可とされる）</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年分）による模式図。提出前に国税庁などの公式情報で確認してください</text></svg>