<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="領収書（売上代金の受取書）の受取金額と収入印紙の額の早見（執筆時点の印紙税額一覧表）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">収入印紙の金額早見（領収書＝金銭の受取書・売上代金の場合）</text><rect x="30" y="44" width="840" height="28" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="46" y="63" class="point" style="font-size:13.5px">領収書に書いた受取金額（売上代金）</text><text x="436" y="63" class="point" style="font-size:13.5px">収入印紙の額（印紙税）</text><rect x="30" y="76" width="840" height="26" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="46" y="95" class="axis" style="fill:#173042;font-size:13.5px">5万円未満</text><text x="436" y="95" class="axis" style="fill:#2f9e64;font-size:14px;font-weight:bold">非課税（印紙は要らない）</text><rect x="30" y="105" width="840" height="26" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="46" y="124" class="axis" style="fill:#173042;font-size:13.5px">5万円以上 100万円以下</text><text x="436" y="124" class="axis" style="fill:#d24b4b;font-size:14px;font-weight:bold">200円</text><rect x="30" y="134" width="840" height="26" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="46" y="153" class="axis" style="fill:#173042;font-size:13.5px">100万円を超え 200万円以下</text><text x="436" y="153" class="axis" style="fill:#d24b4b;font-size:14px;font-weight:bold">400円</text><rect x="30" y="163" width="840" height="26" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="46" y="182" class="axis" style="fill:#173042;font-size:13.5px">200万円を超え 300万円以下</text><text x="436" y="182" class="axis" style="fill:#d24b4b;font-size:14px;font-weight:bold">600円</text><rect x="30" y="192" width="840" height="26" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="46" y="211" class="axis" style="fill:#173042;font-size:13.5px">300万円を超え 500万円以下</text><text x="436" y="211" class="axis" style="fill:#d24b4b;font-size:14px;font-weight:bold">1,000円</text><rect x="30" y="221" width="840" height="26" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="46" y="240" class="axis" style="fill:#173042;font-size:13.5px">500万円を超え 1,000万円以下</text><text x="436" y="240" class="axis" style="fill:#d24b4b;font-size:14px;font-weight:bold">2,000円</text><rect x="30" y="250" width="840" height="26" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="46" y="269" class="axis" style="fill:#173042;font-size:13.5px">1,000万円を超え 2,000万円以下</text><text x="436" y="269" class="axis" style="fill:#d24b4b;font-size:14px;font-weight:bold">4,000円　（これより上も段階的に上がる）</text><text x="46" y="297" class="axis" style="fill:#607481;font-size:12.5px">電子データ（PDF・メール）の領収書は不要。消費税額を分けて書けば税抜金額で判断。貼るのは発行する側、消印も必要</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の国税庁「印紙税額一覧表」による（令和7年分の制度で確認）。貼る前に最新の一覧表で必ず確認してください</text></svg>