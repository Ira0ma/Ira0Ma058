<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="白色申告と青色申告の比較（対象の所得・事前の申請・書類・帳簿・特典。執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">白色申告と青色申告の比較</text><rect x="30" y="44" width="840" height="30" rx="8" fill="#fff4ec" stroke="#d24b4b" stroke-width="1.5"/><text x="450" y="64" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:13px;font-weight:bold">前提：青色・白色は「事業所得・不動産所得・山林所得」の話。雑所得（FX・暗号資産・副業の雑所得）はどちらでもない</text><rect x="30" y="82" width="840" height="32" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="42" y="103" class="point" style="font-size:14px">項目</text><text x="202" y="103" class="point" style="fill:#607481;font-size:14px">白色申告</text><text x="442" y="103" class="point" style="fill:#3a6fd8;font-size:14px">青色申告</text><rect x="30" y="120" width="840" height="40" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="146" class="axis" style="fill:#173042;font-size:14px;font-weight:bold">事前の申請</text><text x="202" y="146" class="axis" style="fill:#173042;font-size:14px">いらない</text><text x="442" y="146" class="axis" style="fill:#173042;font-size:14px">青色申告承認申請が必要（期限あり）</text><rect x="30" y="164" width="840" height="40" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="190" class="axis" style="fill:#173042;font-size:14px;font-weight:bold">申告で出す書類</text><text x="202" y="190" class="axis" style="fill:#173042;font-size:14px">収支内訳書</text><text x="442" y="190" class="axis" style="fill:#173042;font-size:14px">青色申告決算書</text><rect x="30" y="208" width="840" height="40" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="234" class="axis" style="fill:#173042;font-size:14px;font-weight:bold">帳簿</text><text x="202" y="234" class="axis" style="fill:#173042;font-size:14px">簡単な記帳と、帳簿・書類の保存</text><text x="442" y="234" class="axis" style="fill:#173042;font-size:14px">正規の帳簿（複式簿記など）と保存</text><rect x="30" y="252" width="840" height="40" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><text x="42" y="278" class="axis" style="fill:#173042;font-size:14px;font-weight:bold">主な特典</text><text x="202" y="278" class="axis" style="fill:#173042;font-size:14px">なし</text><text x="442" y="278" class="axis" style="fill:#173042;font-size:14px">特別控除（最高65万円）・赤字の繰越など ※条件あり</text><line x1="190" x2="190" y1="82" y2="296" stroke="#dde5ea"/><line x1="430" x2="430" y1="82" y2="296" stroke="#dde5ea"/><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年分）による模式図。提出前に国税庁などの公式情報で確認してください</text></svg>