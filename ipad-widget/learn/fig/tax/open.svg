<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="開業から稼働までの流れ（開業日・開業届・青色申告承認申請・帳簿付けの開始・初めての確定申告）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">開業から稼働までの流れ（開業1年目）</text><rect x="30" y="70" width="150" height="120" rx="12" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><circle cx="105.0" cy="70" r="13" fill="#2f9e64"/><text x="105.0" y="75" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">1</text><text x="105.0" y="112" class="point" text-anchor="middle" style="fill:#2f9e64;font-size:14.5px">開業日</text><text x="105.0" y="142" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">事業を始めた日</text><line x1="182" y1="130" x2="200" y2="130" stroke="#607481" stroke-width="2"/><path d="M191.9 133.9 L200 130 L191.9 126.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="202" y="70" width="150" height="120" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><circle cx="277.0" cy="70" r="13" fill="#b98a32"/><text x="277.0" y="75" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">2</text><text x="277.0" y="112" class="point" text-anchor="middle" style="fill:#b98a32;font-size:14.5px">開業届</text><text x="277.0" y="142" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">税務署へ（期限は</text><text x="277.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">公式で確認）</text><line x1="354" y1="130" x2="372" y2="130" stroke="#607481" stroke-width="2"/><path d="M363.9 133.9 L372 130 L363.9 126.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="70" width="150" height="120" rx="12" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><circle cx="449.0" cy="70" r="13" fill="#3a6fd8"/><text x="449.0" y="75" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">3</text><text x="449.0" y="112" class="point" text-anchor="middle" style="fill:#3a6fd8;font-size:13px">青色申告承認申請</text><text x="449.0" y="142" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">青色にしたい人だけ</text><text x="449.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">1/16以後の開業は2か月内</text><line x1="526" y1="130" x2="544" y2="130" stroke="#607481" stroke-width="2"/><path d="M535.9 133.9 L544 130 L535.9 126.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="546" y="70" width="150" height="120" rx="12" fill="#ffffff" stroke="#173042" stroke-width="2"/><circle cx="621.0" cy="70" r="13" fill="#173042"/><text x="621.0" y="75" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">4</text><text x="621.0" y="112" class="point" text-anchor="middle" style="fill:#173042;font-size:14.5px">帳簿付けの開始</text><text x="621.0" y="142" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">口座を分けて</text><text x="621.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">毎月記録</text><line x1="698" y1="130" x2="716" y2="130" stroke="#607481" stroke-width="2"/><path d="M707.9 133.9 L716 130 L707.9 126.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="718" y="70" width="150" height="120" rx="12" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><circle cx="793.0" cy="70" r="13" fill="#d24b4b"/><text x="793.0" y="75" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">5</text><text x="793.0" y="112" class="point" text-anchor="middle" style="fill:#d24b4b;font-size:13px">初めての確定申告</text><text x="793.0" y="142" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">翌年の申告期間</text><text x="793.0" y="162" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px">（原則2/16〜3/15）</text><rect x="30" y="214" width="840" height="74" rx="10" fill="#fbf3e3" stroke="#b98a32" stroke-width="1.2"/><text x="50" y="240" class="axis" style="fill:#173042;font-size:14px">・2と3は同じ日に出すのが確実（3は期限が短い。過ぎるとその年は青色にできない）</text><text x="50" y="266" class="axis" style="fill:#173042;font-size:14px">・開業届を出しても、事業所得になると決まるわけではない（実態で判断）</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年分）による模式図。提出前に国税庁などの公式情報で確認してください</text></svg>