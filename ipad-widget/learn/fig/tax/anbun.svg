<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="通信費を仕事に使った割合と生活に使った割合に分ける按分のイメージ（仮定の数字）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">按分（あんぶん）のイメージ：仕事の分だけを経費にする</text><text x="60" y="72" class="point" style="font-size:15px">1か月の通信費　6,000円（仮定の数字）</text><rect x="60" y="86" width="312.0" height="56" rx="10" fill="#2f9e64"/><rect x="376.0" y="86" width="464.0" height="56" rx="10" fill="#c9d5dc"/><text x="216.0" y="112" class="point" text-anchor="middle" style="fill:#ffffff;font-size:15px">仕事に使った分　4割</text><text x="216.0" y="132" class="axis" text-anchor="middle" style="fill:#ffffff;font-size:14px;font-weight:bold">2,400円 → 経費にする</text><text x="606.0" y="112" class="point" text-anchor="middle" style="font-size:15px">生活に使った分　6割</text><text x="606.0" y="132" class="axis" text-anchor="middle" style="fill:#173042;font-size:14px">3,600円 → 経費にしない</text><rect x="60" y="166" width="780" height="112" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="1.5"/><text x="80" y="194" class="point" style="fill:#b98a32;font-size:14.5px">根拠のメモ（例）</text><text x="80" y="220" class="axis" style="fill:#173042;font-size:14px">・使い方：平日の夜と休日に、記事づくりで週12時間ほど使う</text><text x="80" y="244" class="axis" style="fill:#173042;font-size:14px">・割合：1週間の利用時間のうち約4割が仕事　→　4割で按分</text><text x="80" y="268" class="axis" style="fill:#607481;font-size:13.5px">・「何割なら大丈夫」という決まった数字はない。実態で決め、迷ったら税務署へ</text><text x="450" y="318" class="foot" text-anchor="middle">説明用の模式図。割合は自分の使い方の実態で決め、根拠を残します。扱いは国税庁などの公式情報で確認してください</text></svg>