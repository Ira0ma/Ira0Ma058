<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="会社員が副業をしている場合の1年のスケジュール（記録・源泉徴収票・集計・申告・住民税の通知）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">兼業の1年スケジュール（対象の年と、翌年の流れ）</text><rect x="40.0" y="50" width="542.6666666666666" height="30" rx="8" fill="#e9f3ee" stroke="#2f9e64" stroke-width="1.5"/><text x="313.3333333333333" y="71" class="point" text-anchor="middle" style="fill:#2f9e64;font-size:14.5px">対象の1年（1月〜12月）</text><rect x="586.6666666666666" y="50" width="273.33333333333337" height="30" rx="8" fill="#fbf3e3" stroke="#b98a32" stroke-width="1.5"/><text x="723.3333333333333" y="71" class="point" text-anchor="middle" style="fill:#b98a32;font-size:14.5px">翌年</text><rect x="40" y="88" width="820" height="10" rx="3" fill="#e3eaee"/><text x="62.77777777777778" y="116" class="axis" text-anchor="middle" style="font-size:12px">1月</text><text x="108.33333333333333" y="116" class="axis" text-anchor="middle" style="font-size:12px">2月</text><text x="153.88888888888889" y="116" class="axis" text-anchor="middle" style="font-size:12px">3月</text><text x="199.44444444444446" y="116" class="axis" text-anchor="middle" style="font-size:12px">4月</text><text x="245.0" y="116" class="axis" text-anchor="middle" style="font-size:12px">5月</text><text x="290.55555555555554" y="116" class="axis" text-anchor="middle" style="font-size:12px">6月</text><text x="336.1111111111111" y="116" class="axis" text-anchor="middle" style="font-size:12px">7月</text><text x="381.6666666666667" y="116" class="axis" text-anchor="middle" style="font-size:12px">8月</text><text x="427.22222222222223" y="116" class="axis" text-anchor="middle" style="font-size:12px">9月</text><text x="472.77777777777777" y="116" class="axis" text-anchor="middle" style="font-size:12px">10月</text><text x="518.3333333333333" y="116" class="axis" text-anchor="middle" style="font-size:12px">11月</text><text x="563.8888888888889" y="116" class="axis" text-anchor="middle" style="font-size:12px">12月</text><text x="609.4444444444445" y="116" class="axis" text-anchor="middle" style="font-size:12px">1月</text><text x="655.0" y="116" class="axis" text-anchor="middle" style="font-size:12px">2月</text><text x="700.5555555555555" y="116" class="axis" text-anchor="middle" style="font-size:12px">3月</text><text x="746.1111111111111" y="116" class="axis" text-anchor="middle" style="font-size:12px">4月</text><text x="791.6666666666666" y="116" class="axis" text-anchor="middle" style="font-size:12px">5月</text><text x="837.2222222222222" y="116" class="axis" text-anchor="middle" style="font-size:12px">6月</text><rect x="40.0" y="88" width="542.1" height="10" rx="3" fill="#2f9e64" opacity=".55"/><rect x="586.7" y="88" width="45.6" height="10" rx="3" fill="#173042"/><rect x="614.0" y="88" width="41.0" height="10" rx="3" fill="#3a6fd8"/><rect x="655.0" y="88" width="45.6" height="10" rx="3" fill="#d24b4b"/><rect x="768.9" y="88" width="91.1" height="10" rx="3" fill="#b98a32"/><circle cx="313.3" cy="93" r="11" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><text x="313.3" y="98" class="axis" text-anchor="middle" style="fill:#2f9e64;font-size:13px;font-weight:bold">1</text><circle cx="68" cy="141" r="10" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><text x="68" y="146" class="axis" text-anchor="middle" style="fill:#2f9e64;font-size:12.5px;font-weight:bold">1</text><text x="90" y="146" class="axis" style="fill:#2f9e64;font-size:14.5px;font-weight:bold">1年中</text><text x="215" y="146" class="axis" style="fill:#173042;font-size:14.5px">副業の売上・経費・確定した報酬を記録する</text><circle cx="600.3" cy="93" r="11" fill="#ffffff" stroke="#173042" stroke-width="2"/><text x="600.3" y="98" class="axis" text-anchor="middle" style="fill:#173042;font-size:13px;font-weight:bold">2</text><circle cx="68" cy="171" r="10" fill="#ffffff" stroke="#173042" stroke-width="2"/><text x="68" y="176" class="axis" text-anchor="middle" style="fill:#173042;font-size:12.5px;font-weight:bold">2</text><text x="90" y="176" class="axis" style="fill:#173042;font-size:14.5px;font-weight:bold">1月</text><text x="215" y="176" class="axis" style="fill:#173042;font-size:14.5px">会社から源泉徴収票を受け取る</text><circle cx="641.3" cy="93" r="11" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><text x="641.3" y="98" class="axis" text-anchor="middle" style="fill:#3a6fd8;font-size:13px;font-weight:bold">3</text><circle cx="68" cy="201" r="10" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><text x="68" y="206" class="axis" text-anchor="middle" style="fill:#3a6fd8;font-size:12.5px;font-weight:bold">3</text><text x="90" y="206" class="axis" style="fill:#3a6fd8;font-size:14.5px;font-weight:bold">1〜2月</text><text x="215" y="206" class="axis" style="fill:#173042;font-size:14.5px">1年分を集計。業者の年間損益の報告書を取り寄せる</text><circle cx="686.9" cy="93" r="11" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="686.9" y="98" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:13px;font-weight:bold">4</text><circle cx="68" cy="231" r="10" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="68" y="236" class="axis" text-anchor="middle" style="fill:#d24b4b;font-size:12.5px;font-weight:bold">4</text><text x="90" y="236" class="axis" style="fill:#d24b4b;font-size:14.5px;font-weight:bold">2/16〜3/15</text><text x="215" y="236" class="axis" style="fill:#173042;font-size:14.5px">確定申告をして、所得税を納める（原則の期間）</text><circle cx="814.4" cy="93" r="11" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="814.4" y="98" class="axis" text-anchor="middle" style="fill:#b98a32;font-size:13px;font-weight:bold">5</text><circle cx="68" cy="261" r="10" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="68" y="266" class="axis" text-anchor="middle" style="fill:#b98a32;font-size:12.5px;font-weight:bold">5</text><text x="90" y="266" class="axis" style="fill:#b98a32;font-size:14.5px;font-weight:bold">5〜6月ごろ</text><text x="215" y="266" class="axis" style="fill:#173042;font-size:14.5px">住民税の通知。会社員は会社にも通知が届き、給与から引かれる額が変わる</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年分）による模式図。提出前に国税庁などの公式情報で確認してください</text></svg>