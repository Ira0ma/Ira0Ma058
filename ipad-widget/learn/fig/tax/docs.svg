<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="取引書類の流れ（見積書・注文書・納品書・請求書・領収書）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">取引書類の流れ（一般的な順番）</text><rect x="30" y="64" width="150" height="110" rx="12" fill="#ffffff" stroke="#607481" stroke-width="2"/><text x="105.0" y="98" class="point" text-anchor="middle" style="fill:#607481;font-size:17px">見積書</text><text x="105.0" y="126" class="axis" text-anchor="middle" style="fill:#173042;font-size:14px">金額の提案</text><text x="105.0" y="152" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">自分 → 相手</text><line x1="182" y1="119" x2="200" y2="119" stroke="#607481" stroke-width="2"/><path d="M191.9 122.9 L200 119 L191.9 115.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="202" y="64" width="150" height="110" rx="12" fill="#ffffff" stroke="#173042" stroke-width="2"/><text x="277.0" y="98" class="point" text-anchor="middle" style="fill:#173042;font-size:17px">注文書</text><text x="277.0" y="126" class="axis" text-anchor="middle" style="fill:#173042;font-size:14px">仕事の依頼</text><text x="277.0" y="152" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">相手 → 自分</text><line x1="354" y1="119" x2="372" y2="119" stroke="#607481" stroke-width="2"/><path d="M363.9 122.9 L372 119 L363.9 115.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="374" y="64" width="150" height="110" rx="12" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><text x="449.0" y="98" class="point" text-anchor="middle" style="fill:#2f9e64;font-size:17px">納品書</text><text x="449.0" y="126" class="axis" text-anchor="middle" style="fill:#173042;font-size:14px">納めた証拠</text><text x="449.0" y="152" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">自分 → 相手</text><line x1="526" y1="119" x2="544" y2="119" stroke="#607481" stroke-width="2"/><path d="M535.9 122.9 L544 119 L535.9 115.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="546" y="64" width="150" height="110" rx="12" fill="#ffffff" stroke="#3a6fd8" stroke-width="2"/><text x="621.0" y="98" class="point" text-anchor="middle" style="fill:#3a6fd8;font-size:17px">請求書</text><text x="621.0" y="126" class="axis" text-anchor="middle" style="fill:#173042;font-size:14px">代金の請求</text><text x="621.0" y="152" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">自分 → 相手</text><line x1="698" y1="119" x2="716" y2="119" stroke="#607481" stroke-width="2"/><path d="M707.9 122.9 L716 119 L707.9 115.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="718" y="64" width="150" height="110" rx="12" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="793.0" y="98" class="point" text-anchor="middle" style="fill:#d24b4b;font-size:17px">領収書</text><text x="793.0" y="126" class="axis" text-anchor="middle" style="fill:#173042;font-size:14px">受け取った証明</text><text x="793.0" y="152" class="axis" text-anchor="middle" style="fill:#607481;font-size:12.5px">自分 → 相手</text><line x1="30" x2="868" y1="196" y2="196" stroke="#c9d5dc" stroke-width="2"/><text x="191.0" y="218" class="axis" text-anchor="middle" style="fill:#607481;font-size:13px">仕事の前</text><text x="449.0" y="218" class="axis" text-anchor="middle" style="fill:#607481;font-size:13px">納品</text><text x="707.0" y="218" class="axis" text-anchor="middle" style="fill:#607481;font-size:13px">入金のあと</text><rect x="30" y="234" width="840" height="54" rx="10" fill="#fbf3e3" stroke="#b98a32" stroke-width="1.2"/><text x="48" y="257" class="axis" style="fill:#173042;font-size:13.5px">・小さな取引では、一部を省いたり、請求書と納品書を兼ねたりすることもある（相手と決めておく）</text><text x="48" y="278" class="axis" style="fill:#173042;font-size:13.5px">・振込で受け取った代金は、振込の記録が受け取りの証拠になるため、領収書を出さないことも多い</text><text x="450" y="318" class="foot" text-anchor="middle">一般的な流れを示した模式図。実際にやり取りする書類は取引によって違います</text></svg>