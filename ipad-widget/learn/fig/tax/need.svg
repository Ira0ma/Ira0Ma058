<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="会社員が所得税の確定申告をする必要があるかを確かめるフローチャート（執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="30" y="32" class="point">会社員（給与所得者）の場合：所得税の確定申告が要るか</text><rect x="30" y="50" width="250" height="72" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="155" y="80" class="axis" text-anchor="middle" style="fill:#173042;font-weight:bold">給与は1か所から・</text><text x="155" y="100" class="axis" text-anchor="middle" style="fill:#173042;font-weight:bold">年末調整を受けた？</text><rect x="325" y="50" width="250" height="72" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="450" y="80" class="axis" text-anchor="middle" style="fill:#173042;font-weight:bold">給与以外の所得の合計が</text><text x="450" y="100" class="axis" text-anchor="middle" style="fill:#173042;font-weight:bold">20万円を超える？</text><rect x="620" y="50" width="250" height="72" rx="12" fill="#ffffff" stroke="#b98a32" stroke-width="2"/><text x="745" y="80" class="axis" text-anchor="middle" style="fill:#173042;font-weight:bold">医療費控除などで申告する？</text><text x="745" y="100" class="axis" text-anchor="middle" style="fill:#173042;font-weight:bold">損失を繰り越したい？</text><line x1="280" y1="86" x2="322" y2="86" stroke="#607481" stroke-width="2"/><path d="M313.9 89.9 L322 86 L313.9 82.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="301" y="78" class="axis" text-anchor="middle" style="fill:#2f9e64;font-weight:bold">はい</text><line x1="575" y1="86" x2="617" y2="86" stroke="#607481" stroke-width="2"/><path d="M608.9 89.9 L617 86 L608.9 82.1" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="596" y="78" class="axis" text-anchor="middle" style="fill:#3a6fd8;font-size:13px;font-weight:bold">いいえ</text><line x1="155" y1="122" x2="155" y2="193" stroke="#607481" stroke-width="2"/><path d="M151.1 184.9 L155 193 L158.9 184.9" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="164" class="axis" style="fill:#3a6fd8;font-weight:bold">いいえ</text><line x1="450" y1="122" x2="450" y2="193" stroke="#607481" stroke-width="2"/><path d="M446.1 184.9 L450 193 L453.9 184.9" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="460" y="164" class="axis" style="fill:#2f9e64;font-weight:bold">はい</text><line x1="700" y1="122" x2="560" y2="193" stroke="#607481" stroke-width="2"/><path d="M565.5 185.8 L560 193 L569.0 192.8" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="640" y="150" class="axis" style="fill:#2f9e64;font-weight:bold">はい</text><line x1="790" y1="122" x2="790" y2="193" stroke="#607481" stroke-width="2"/><path d="M786.1 184.9 L790 193 L793.9 184.9" fill="none" stroke="#607481" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="164" class="axis" style="fill:#3a6fd8;font-weight:bold">いいえ</text><rect x="30" y="196" width="250" height="84" rx="12" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="155" y="228" class="axis" text-anchor="middle" style="fill:#d24b4b;font-weight:bold">申告が必要なことが多い</text><text x="155" y="250" class="axis" text-anchor="middle" style="fill:#d24b4b;font-weight:bold">（条件は公式情報で）</text><rect x="325" y="196" width="250" height="84" rx="12" fill="#ffffff" stroke="#d24b4b" stroke-width="2"/><text x="450" y="228" class="axis" text-anchor="middle" style="fill:#d24b4b;font-weight:bold">所得税の確定申告をする</text><text x="450" y="250" class="axis" text-anchor="middle" style="fill:#d24b4b;font-weight:bold">（副業の所得もすべて書く）</text><rect x="620" y="196" width="250" height="84" rx="12" fill="#ffffff" stroke="#2f9e64" stroke-width="2"/><text x="745" y="226" class="axis" text-anchor="middle" style="fill:#2f9e64;font-weight:bold">所得税の申告は原則不要</text><text x="745" y="250" class="axis" text-anchor="middle" style="fill:#173042;font-size:14px">住民税の申告は別に必要</text><text x="745" y="269" class="axis" text-anchor="middle" style="fill:#173042;font-size:14px">（市区町村へ）</text><text x="450" y="318" class="foot" text-anchor="middle">執筆時点の制度（令和7年分）による模式図。提出前に国税庁などの公式情報で確認してください</text></svg>