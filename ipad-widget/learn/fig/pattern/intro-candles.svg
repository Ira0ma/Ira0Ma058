<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="陽線の高値・終値・始値・安値を示す図"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;font-weight:700;fill:#173042}.lvl{font-size:16px;fill:#a57828}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><path d="M160 45V260" stroke="#087f78" stroke-width="4"/><rect x="130" y="100" width="60" height="105" fill="#087f78"/><path d="M160 45H320M190 100H320M190 205H320M160 260H320" stroke="#a57828" stroke-width="2" stroke-dasharray="6 5"/><text x="340" y="51" class="point">高値：いちばん高い価格</text><text x="340" y="106" class="point">終値：終わりの価格</text><text x="340" y="211" class="point">始値：始めの価格</text><text x="340" y="266" class="point">安値：いちばん安い価格</text><text x="80" y="310" class="axis">緑の足：始めより上がって終わる「陽線」の例</text></svg>