<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="価格推移の模式図"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;font-weight:700;fill:#173042}.lvl{font-size:16px;fill:#a57828}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><path d="M60 58H840" stroke="#dde5e8"/><path d="M60 108H840" stroke="#dde5e8"/><path d="M60 158H840" stroke="#dde5e8"/><path d="M60 208H840" stroke="#dde5e8"/><path d="M60 258H840" stroke="#dde5e8"/><text x="18" y="30" class="axis">価格</text><text x="798" y="304" class="axis">時間 →</text><polyline points="70.0,228.0 290.0,142.0 510.0,178.0 730.0,92.0" fill="none" stroke="#173042" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="70.0" cy="228" r="4" fill="#a57828"/><text x="70.0" y="214" text-anchor="middle" class="point">起点</text><circle cx="290.0" cy="142" r="4" fill="#a57828"/><text x="290.0" y="128" text-anchor="middle" class="point">上昇</text><circle cx="510.0" cy="178" r="4" fill="#a57828"/><text x="510.0" y="201" text-anchor="middle" class="point">押し</text><circle cx="730.0" cy="92" r="4" fill="#a57828"/><text x="730.0" y="78" text-anchor="middle" class="point">再上昇</text><text x="70" y="316" class="axis">上昇Nの例。最初と最後の上昇を等幅で描いた模式図。</text></svg>