<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="年収の壁の全体マップ（3つの系統と主なライン。令和8年分・執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}</style><rect width="900" height="400" rx="16" fill="#f4f7f8"/><text x="30" y="34" class="point">年収の壁の全体マップ：系統 → 主なライン（令和8年分） → 越えたらどうなる</text><rect x="30" y="48" width="840" height="28" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="44" y="67" class="point" style="font-size:14px">系統</text><text x="204" y="67" class="point" style="font-size:14px">主なライン（給与収入だけの場合）</text><text x="624" y="67" class="point" style="font-size:14px">越えたらどうなる</text><rect x="30" y="82" width="840" height="76" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="82" width="6" height="76" rx="3" fill="#3a6fd8"/><text x="44" y="112" class="axis" style="fill:#3a6fd8;font-size:15px;font-weight:bold">① 税金</text><text x="44" y="134" class="axis" style="font-size:12.5px">本人の所得税・住民税</text><text x="204" y="106" class="axis" style="fill:#173042;font-size:13.5px">所得税は年収178万円から（令和7年分は160万円）</text><text x="204" y="128" class="axis" style="fill:#173042;font-size:13.5px">住民税の非課税の目安は年収110万円以下（東京23区・自治体で違う）</text><text x="204" y="150" class="axis" style="fill:#173042;font-size:13.5px">　</text><text x="624" y="106" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">超えた分にだけ税金がかかる</text><text x="624" y="128" class="axis" style="fill:#173042;font-size:13.5px">「坂道」型：手取りは逆転しない</text><rect x="30" y="164" width="840" height="98" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="164" width="6" height="98" rx="3" fill="#64c2a3"/><text x="44" y="194" class="axis" style="fill:#226b52;font-size:15px;font-weight:bold">② 社会保険</text><text x="44" y="216" class="axis" style="font-size:12.5px">家族の扶養の認定</text><text x="204" y="188" class="axis" style="fill:#173042;font-size:13.5px">被扶養者の認定は年間収入130万円未満（見込み）</text><text x="204" y="210" class="axis" style="fill:#173042;font-size:13.5px">60歳以上・障害者は180万円未満／19〜22歳は150万円未満</text><text x="204" y="232" class="axis" style="fill:#173042;font-size:13.5px">勤務先の社会保険は「週20時間・規模51人以上」などで決まる</text><text x="204" y="254" class="axis" style="fill:#173042;font-size:13.5px">（月額8.8万円の要件は令和8年10月に撤廃）</text><text x="624" y="188" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">保険料が一度に発生する</text><text x="624" y="210" class="axis" style="fill:#173042;font-size:13.5px">「崖」型：手取りの谷ができる</text><text x="624" y="232" class="axis" style="fill:#173042;font-size:13.5px">代わりに保障と年金が付く</text><rect x="30" y="268" width="840" height="76" rx="6" fill="#ffffff" stroke="#dde5ea" stroke-width="1"/><rect x="30" y="268" width="6" height="76" rx="3" fill="#d88a3a"/><text x="44" y="298" class="axis" style="fill:#d88a3a;font-size:15px;font-weight:bold">③ 配偶者控除</text><text x="44" y="320" class="axis" style="font-size:12.5px">家族（配偶者）の税金</text><text x="204" y="292" class="axis" style="fill:#173042;font-size:13.5px">配偶者控除は配偶者の給与136万円以下で38万円</text><text x="204" y="314" class="axis" style="fill:#173042;font-size:13.5px">配偶者特別控除は207万円超でゼロ／特定親族特別控除は197万円以下</text><text x="204" y="336" class="axis" style="fill:#173042;font-size:13.5px">　</text><text x="624" y="292" class="axis" style="fill:#173042;font-size:13.5px;font-weight:bold">控除が少しずつ減っていく</text><text x="624" y="314" class="axis" style="fill:#173042;font-size:13.5px">「坂道」型：急にはなくならない</text><text x="30" y="372" class="foot">令和8年分の制度（執筆時点）。数字は変わることがあるため、判断の前に公式情報で確認してください。</text></svg>
