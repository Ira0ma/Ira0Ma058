<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 612" role="img" aria-label="社会保険に入るかどうかの判定フローチャート（令和8年10月以降・執筆時点の制度）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}.q{font-size:14.5px;fill:#173042;font-weight:bold}.r{font-size:14.5px;fill:#173042}.yn{font-size:13px;font-weight:bold}</style><rect width="900" height="612" rx="16" fill="#f4f7f8"/><text x="30" y="34" class="point">社会保険に入るかどうかの判定フロー（令和8年10月以降）</text><rect x="60" y="50" width="400" height="40" rx="8" fill="#e7eef1" stroke="#c9d5dc" stroke-width="1.5"/><text x="76" y="75" class="q">勤め先で働いている（パート・アルバイトなど）</text><line x1="260" y1="90" x2="260" y2="106" stroke="#607481" stroke-width="2"/><polygon points="260,112 254,102 266,102" fill="#607481"/><rect x="60" y="112" width="400" height="54" rx="8" fill="#ffffff" stroke="#64c2a3" stroke-width="2"/><text x="76" y="134" class="q">Q1 週の労働時間・日数が、通常の労働者の</text><text x="76" y="156" class="q">　　4分の3以上ある？</text><line x1="460" y1="139" x2="506" y2="139" stroke="#226b52" stroke-width="2"/><polygon points="512,139 502,133 502,145" fill="#226b52"/><text x="466" y="130" class="yn" fill="#226b52">はい</text><rect x="512" y="112" width="358" height="54" rx="8" fill="#e3f2ec" stroke="#64c2a3" stroke-width="1.5"/><text x="528" y="134" class="q" style="fill:#226b52">勤務先の社会保険に加入</text><text x="528" y="156" class="r" style="font-size:13px">（通常の被保険者として）</text><line x1="260" y1="166" x2="260" y2="182" stroke="#607481" stroke-width="2"/><polygon points="260,188 254,178 266,178" fill="#607481"/><text x="270" y="180" class="yn" fill="#607481">いいえ</text><rect x="60" y="188" width="400" height="54" rx="8" fill="#ffffff" stroke="#64c2a3" stroke-width="2"/><text x="76" y="210" class="q">Q2 週の所定労働時間は20時間以上？</text><text x="76" y="232" class="r" style="font-size:13px">（月額8.8万円の賃金要件は令和8年10月に撤廃）</text><line x1="260" y1="242" x2="260" y2="258" stroke="#607481" stroke-width="2"/><polygon points="260,264 254,254 266,254" fill="#607481"/><text x="270" y="256" class="yn" fill="#226b52">はい</text><rect x="60" y="264" width="400" height="54" rx="8" fill="#ffffff" stroke="#64c2a3" stroke-width="2"/><text x="76" y="286" class="q">Q3 勤め先は、被保険者数51人以上の企業？</text><text x="76" y="308" class="r" style="font-size:13px">（規模の要件は今後、段階的に小さくなる予定）</text><line x1="260" y1="318" x2="260" y2="334" stroke="#607481" stroke-width="2"/><polygon points="260,340 254,330 266,330" fill="#607481"/><text x="270" y="332" class="yn" fill="#226b52">はい</text><rect x="60" y="340" width="400" height="54" rx="8" fill="#ffffff" stroke="#64c2a3" stroke-width="2"/><text x="76" y="362" class="q">Q4 学生でなく、2か月を超える雇用の</text><text x="76" y="384" class="q">　　見込みがある？</text><line x1="460" y1="367" x2="506" y2="367" stroke="#226b52" stroke-width="2"/><polygon points="512,367 502,361 502,373" fill="#226b52"/><text x="466" y="358" class="yn" fill="#226b52">はい</text><rect x="512" y="340" width="358" height="54" rx="8" fill="#e3f2ec" stroke="#64c2a3" stroke-width="1.5"/><text x="528" y="362" class="q" style="fill:#226b52">勤務先の社会保険に加入</text><text x="528" y="384" class="r" style="font-size:13px">（短時間労働者として）</text><line x1="120" y1="242" x2="120" y2="428" stroke="#b06a6a" stroke-width="2"/><line x1="120" y1="318" x2="120" y2="428" stroke="#b06a6a" stroke-width="2"/><line x1="120" y1="394" x2="120" y2="428" stroke="#b06a6a" stroke-width="2"/><line x1="60" y1="428" x2="840" y2="428" stroke="#b06a6a" stroke-width="2"/><polygon points="450,436 444,426 456,426" fill="#b06a6a"/><text x="130" y="420" class="yn" fill="#b06a6a">Q2〜Q4のどれかで「いいえ」</text><rect x="60" y="436" width="810" height="62" rx="8" fill="#ffffff" stroke="#dde5ea" stroke-width="1.5"/><text x="76" y="460" class="q">勤務先の社会保険には入らない → 家族の被扶養者になれるかを判定</text><text x="76" y="484" class="r" style="font-size:13.5px">年間収入の見込み：原則130万円未満（60歳以上・障害者は180万円未満／19〜22歳は150万円未満）</text><rect x="60" y="512" width="395" height="46" rx="8" fill="#e3f2ec" stroke="#64c2a3" stroke-width="1.5"/><text x="76" y="540" class="q" style="fill:#226b52;font-size:14px">基準の内側 → 被扶養者（自分の保険料なし）</text><rect x="475" y="512" width="395" height="46" rx="8" fill="#f7e8e8" stroke="#d8a3a3" stroke-width="1.5"/><text x="491" y="540" class="q" style="fill:#8a3d3d;font-size:14px">基準を超える → 国民年金・国民健康保険に自分で入る</text><text x="30" y="590" class="foot">執筆時点の制度です。認定の最終判断は、家族が加入している健康保険が行います。</text></svg>
