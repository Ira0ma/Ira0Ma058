<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-label="手取りのイメージ図（年収と手取りの模式図。前提を置いた説明用の例）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}.tick{font-size:12.5px;fill:#607481}.lg{font-size:13.5px;font-weight:bold}</style><rect width="900" height="430" rx="16" fill="#f4f7f8"/><text x="30" y="34" class="point">手取りのイメージ図：年収と手取り（模式図・説明用の例）</text><rect x="310" y="70" width="160" height="260" fill="#f7e8e8"/><text x="330" y="92" class="lg" style="fill:#8a3d3d">手取りの谷</text><line x1="90" y1="330" x2="850" y2="330" stroke="#9fb3bd" stroke-width="1.5"/><line x1="90" y1="70" x2="90" y2="330" stroke="#9fb3bd" stroke-width="1.5"/><line x1="90" y1="252" x2="850" y2="252" stroke="#dde5ea" stroke-width="1"/><line x1="90" y1="122" x2="850" y2="122" stroke="#dde5ea" stroke-width="1"/><text x="40" y="256" class="tick">100</text><text x="40" y="126" class="tick">150</text><text x="52" y="352" class="tick">手取り（万円）</text><polyline points="90,280.6 310.4,207.8" fill="none" stroke="#226b52" stroke-width="3"/><polyline points="318,254.6 470,215.6 546,194.8 698,155.8 850,119.4" fill="none" stroke="#3a6fd8" stroke-width="3"/><polyline points="318,285.8 470,244.2 622,202.6 850,142.8" fill="none" stroke="#b06a6a" stroke-width="3"/><circle cx="310.4" cy="207.8" r="4.5" fill="#226b52"/><circle cx="318" cy="254.6" r="4.5" fill="#3a6fd8"/><circle cx="318" cy="285.8" r="4.5" fill="#b06a6a"/><text x="120" y="262" class="lg" style="fill:#226b52">扶養の内側（保険料なし）</text><text x="560" y="140" class="lg" style="fill:#3a6fd8">勤務先の社会保険に入る</text><text x="600" y="238" class="lg" style="fill:#b06a6a">国民年金・国民健康保険に入る</text><text x="82" y="352" class="tick">100</text><text x="302" y="352" class="tick">130</text><text x="454" y="352" class="tick">150</text><text x="668" y="352" class="tick">178（所得税のライン）</text><text x="826" y="352" class="tick">200</text><text x="700" y="374" class="tick">年収（万円）</text><text x="30" y="398" class="foot">前提を置いた模式図です：賞与なし、健康保険は協会けんぽの平均料率、国民健康保険料は仮の額で計算。</text><text x="30" y="416" class="foot">実際の手取りは、勤め先・自治体・家族構成で変わります。</text></svg>
