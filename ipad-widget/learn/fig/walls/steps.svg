<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="配偶者特別控除の段階図（配偶者の給与収入と控除額。本人の所得900万円以下・令和8年分）"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.foot{font-size:12.5px;fill:#8a6a2a}.tick{font-size:12.5px;fill:#607481}</style><rect width="900" height="400" rx="16" fill="#f4f7f8"/><text x="30" y="34" class="point">配偶者特別控除の階段：配偶者の給与収入と、家族が受けられる控除額（令和8年分）</text><rect x="90" y="72.5" width="234" height="237.5" fill="#e3f2ec"/><line x1="90" y1="310" x2="870" y2="310" stroke="#9fb3bd" stroke-width="1.5"/><line x1="90" y1="72.5" x2="90" y2="310" stroke="#9fb3bd" stroke-width="1.5"/><polyline points="90,72.5 538.5,72.5 538.5,85 571,85 571,116.25 603.5,116.25 603.5,147.5 636,147.5 636,178.75 668.5,178.75 668.5,210 701,210 701,241.25 733.5,241.25 733.5,272.5 766,272.5 766,291.25 785.5,291.25 785.5,310 870,310" fill="none" stroke="#226b52" stroke-width="3"/><text x="100" y="62" class="point" style="font-size:14px;fill:#226b52">控除額 38万円（満額）</text><text x="100" y="330" class="tick">100万円</text><text x="306" y="330" class="tick">136万円</text><text x="508" y="330" class="tick">169万円</text><text x="752" y="330" class="tick">207万円</text><text x="838" y="330" class="tick">220万円</text><text x="110" y="298" class="tick">この範囲は配偶者控除（38万円）</text><text x="560" y="62" class="tick">配偶者特別控除：少しずつ減る</text><text x="700" y="298" class="point" style="font-size:13.5px;fill:#8a3d3d">207万円超でゼロ</text><text x="30" y="362" class="foot">控除を受ける本人の合計所得金額が900万円以下の場合の表です。本人の所得が900万円を超えると、控除額はこの表より低くなります。</text><text x="30" y="382" class="foot">横軸は配偶者の給与収入、縦は控除額のイメージ（階段の段差は国税庁の段階表どおり）。</text></svg>
