<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="金は価格のドル差から考える"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">金は価格のドル差から考える</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">同じ価格の変化</text><text x="64" y="151" class="axis">3,000.00 → 3,000.10</text><text x="64" y="190" class="axis">価格差は0.10米ドル／オンス</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">最小変動0.01なら</text><text x="484" y="151" class="axis">10目盛りの変化</text><text x="484" y="190" class="axis">何pipかは呼称の定義次第</text></svg>