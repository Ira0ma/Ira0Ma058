<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="ロットをオンスへ直して比べる"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">ロットをオンスへ直して比べる</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">仮に1ロット＝100オンス</text><text x="64" y="151" class="axis">0.01ロット＝1オンス</text><text x="64" y="190" class="axis">0.02ロット＝2オンス</text><text x="64" y="229" class="axis">0.10ロット＝10オンス</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">仮に1ロット＝10オンス</text><text x="484" y="151" class="axis">0.10ロット＝1オンス</text><text x="484" y="190" class="axis">同じ表示でも数量は変わる</text><text x="484" y="229" class="axis">必ず契約サイズを確認</text></svg>