<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="取り返すために数量を倍にしない"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">取り返すために数量を倍にしない</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">100 → 80</text><text x="64" y="151" class="axis">20％の減少</text><text x="64" y="190" class="axis">損失を現在の資金へ反映</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">80 → 100</text><text x="484" y="151" class="axis">25％の増加が必要</text><text x="484" y="190" class="axis">減った率と回復率は違う</text></svg>