<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="金の商品区分へ、FXの25倍を無条件に当てはめない"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">金の商品区分へ、FXの25倍を無条件に当てはめない</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">実効倍率の単純例</text><text x="64" y="151" class="axis">取引金額6,000米ドル</text><text x="64" y="190" class="axis">純資産1,000米ドル → 6倍</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">仮の必要証拠金率5％</text><text x="484" y="151" class="axis">1 ÷ 0.05 → 上限20倍相当</text><text x="484" y="190" class="axis">常に20倍使う意味ではない</text></svg>