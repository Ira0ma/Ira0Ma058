<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="値段が違う理由を、先に確認"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">値段が違う理由を、先に確認</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">スポット等の参照価格</text><text x="64" y="151" class="axis">現在の金価格の目安</text><text x="64" y="190" class="axis">業者と配信時点を確認</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">先物の参照価格</text><text x="484" y="151" class="axis">限月ごとの契約価格</text><text x="484" y="190" class="axis">期限・価格調整を確認</text></svg>