<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="金利は材料の一つで、唯一の価格決定要因ではない"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">金利は材料の一つで、唯一の価格決定要因ではない</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">金そのもの</text><text x="64" y="151" class="axis">利息・配当を生まない</text><text x="64" y="190" class="axis">分散や価値保存の需要もある</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">利息のある資産との比較</text><text x="484" y="151" class="axis">金利の変化が材料になる</text><text x="484" y="190" class="axis">金CFDの費用は別の話</text></svg>