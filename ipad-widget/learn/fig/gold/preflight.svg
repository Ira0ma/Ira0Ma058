<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="押す前に、方向・数量・出口を読み直す"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">押す前に、方向・数量・出口を読み直す</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">計画：2オンス</text><text x="64" y="151" class="axis">1ロット100オンスなら</text><text x="64" y="190" class="axis">0.02ロット</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">入力：0.20ロットだったら</text><text x="484" y="151" class="axis">実際は20オンス</text><text x="484" y="190" class="axis">予定の10倍の数量</text></svg>