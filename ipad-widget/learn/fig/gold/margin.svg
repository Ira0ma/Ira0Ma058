<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="計算のつながり"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="55" y="70" class="point">維持率を 純資産 ÷ 必要証拠金 × 100 とする例</text><rect x="50" y="102" width="800" height="95" rx="10" fill="#ffffff" stroke="none"/><text x="75" y="157" class="point">1,000 ÷ 500 × 100 ＝ 200％</text><text x="60" y="251" class="axis">200％が安全保証ではありません。定義と強制決済条件を確認。</text></svg>