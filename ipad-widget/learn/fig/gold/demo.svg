<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="デモの結果は、実取引の再現保証ではない"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">デモの結果は、実取引の再現保証ではない</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">デモで確かめること</text><text x="64" y="151" class="axis">注文の設定と取消し</text><text x="64" y="190" class="axis">数量計算と画面操作</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">実際に別途確認すること</text><text x="484" y="151" class="axis">約定・費用・流動性</text><text x="484" y="190" class="axis">現実の心理と契約条件</text></svg>