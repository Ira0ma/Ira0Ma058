<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="ほぼ連続取引でも、窓と休止はある"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">ほぼ連続取引でも、窓と休止はある</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">予定の買いの損切り</text><text x="64" y="151" class="axis">2,990を目安に設定</text><text x="64" y="190" class="axis">指定価格は保証とは別</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">仮に再開時2,980なら</text><text x="484" y="151" class="axis">予定より不利な約定の可能性</text><text x="484" y="190" class="axis">休止中は取引できない場合も</text></svg>