<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="計算のつながり"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="55" y="70" class="point">2オンスの買いを、3件に分けても</text><rect x="50" y="102" width="800" height="95" rx="10" fill="#ffffff" stroke="none"/><text x="75" y="157" class="point">合計6オンス × 10ドル逆行 ＝ −60米ドル</text><text x="60" y="251" class="axis">同じ金の買いを分けただけでは、値動きのリスクは分散しない。</text></svg>