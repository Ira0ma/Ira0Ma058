<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="これは時差の例。発表予定を固定しない。"><style>text{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic",sans-serif}.axis{font-size:15px;fill:#607481}.point{font-size:16px;fill:#173042;font-weight:bold}.lvl{font-size:16px;fill:#96702d}</style><rect width="900" height="330" rx="16" fill="#f4f7f8"/><text x="40" y="42" class="point">これは時差の例。発表予定を固定しない。</text><rect x="40" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="64" y="108" class="point">米東部8:30の発表</text><text x="64" y="151" class="axis">米夏時間：日本21:30</text><text x="64" y="190" class="axis">米標準時間：日本22:30</text><rect x="460" y="65" width="390" height="225" rx="10" fill="#ffffff" stroke="none"/><text x="484" y="108" class="point">予定確認のポイント</text><text x="484" y="151" class="axis">日本時間へ変換</text><text x="484" y="190" class="axis">日付・夏時間・公式予定を確認</text></svg>